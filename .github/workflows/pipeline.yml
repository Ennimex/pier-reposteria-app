# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE DE PRUEBAS (el que corre en cada cambio)
#
# Qué hace: encadena todos los tipos de prueba de la app, en orden. Cada
#   etapa es uno de los workflows de esta carpeta, que aquí se llama como
#   workflow reutilizable (workflow_call); cada uno explica en su encabezado
#   qué prueba.
#
#     Pull Request / push a main o develop
#      ├─ unitarias ─────────┐
#      └─ análisis estático ─┤   al mismo tiempo
#                            ▼
#                       aceptación            necesita las dos anteriores
#                            ▼
#      ├─ integración ───────┐
#      └─ regresión ─────────┤   al mismo tiempo; necesitan aceptación
#                            ▼
#      ├─ rendimiento ───────┐
#      └─ esfuerzo ──────────┤   al mismo tiempo; necesitan integración y
#                            ▼   regresión
#               evidencias y decisión         siempre; falla si alguna
#                                             etapa no pasó
#
# Por qué en ese orden: lo rápido y barato va primero. Si falla, las etapas
#   que usan el celular virtual (emulador) ni siquiera arrancan y el
#   resultado llega antes.
# Contra qué servidor: ninguna etapa toca producción. Las que necesitan la
#   API real (integración, rendimiento y esfuerzo) levantan cada una su
#   propio entorno aislado: la API del backend y su base en contenedores,
#   con datos ficticios (tool/entorno_pruebas.sh). El emulador la ve en
#   http://10.0.2.2:3000/api.
# Dónde corre: todos los trabajos en ubuntu-24.04, la imagen fija de GitHub
#   con la que se midieron las líneas base (corrida 40203353175), y no en
#   ubuntu-latest, que cambia de versión cuando GitHub lo decide (migra a
#   Ubuntu 26) y cambiaría el entorno de las pruebas sin avisar.
# Cuándo corre: en cada Pull Request hacia develop (desde feature/*) o
#   hacia main (desde develop o hotfix/*), en cada push a develop o a main
#   (así SonarCloud tiene al día la versión de integración y la oficial) y a
#   mano (Actions → Pipeline de pruebas → Run workflow). A mano se puede
#   marcar «completo»: rendimiento y esfuerzo corren con toda su carga en vez
#   de la versión reducida de los Pull Requests. Cambia cuánta carga, no qué
#   pruebas corren. La estrategia de ramas está en el README.
# Si falla: el job «Evidencias y decisión» falla y GitHub no deja unir el
#   Pull Request (las reglas de protección de main y develop). Su tabla dice
#   a qué rama aplica la decisión. Ninguna etapa usa continue-on-error ni se
#   salta: un job que falla hace fallar el pipeline.
# Dónde ver el resultado: Actions → la corrida → Summary. Arriba, la tabla de
#   evidencias: una fila por etapa con su resultado y sus métricas clave;
#   debajo, el resumen de cada etapa. Los reportes y las capturas están en
#   Artifacts; «evidencias-pipeline-<número>» los junta todos.
# ─────────────────────────────────────────────────────────────────────────────
name: Pipeline de pruebas

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      completo:
        description: Rendimiento y esfuerzo con toda su carga (en los Pull Requests corren reducidas)
        type: boolean
        default: false

# Lo que necesitan las etapas: leer el código y, SonarCloud, el Pull Request.
permissions:
  contents: read
  pull-requests: read

# Un cambio nuevo en el mismo Pull Request cancela la corrida anterior: ya no
# tiene caso probar una versión que cambió. En main y develop no se cancela
# ninguna: cada cambio unido conserva su resultado completo.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # La misma versión de Flutter que usan todas las etapas.
  FLUTTER_VERSION: '3.44.4'

jobs:
  # DIAGNÓSTICO TEMPORAL (esta rama no se mezcla): solo la etapa de
  # integración, que en esta rama corre nada más los flujos en Android 10.
  integracion:
    name: Integración
    uses: ./.github/workflows/integracion.yml
