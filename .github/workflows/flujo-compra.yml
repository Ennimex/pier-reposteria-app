# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: FLUJO DE COMPRA CONTRA EL SERVIDOR REAL (#58)
#
# Qué revisa: con una cuenta de prueba, en un celular Android virtual
#   (emulador), inicia sesión, añade un producto con existencias, va al
#   checkout y toca «Pagar». Comprueba que el servidor de producción prepara
#   el pago en Stripe (modo de prueba) y cierra la hoja de pago sin pagar,
#   así que no se crea ningún pedido; el carrito se vacía al empezar y al
#   terminar.
# Por qué está aparte: necesita la cuenta de prueba y el servidor de
#   producción, así que no corre en el pipeline de los Pull Requests
#   (pipeline.yml), que usa el servidor de mentira. Antes era el segundo
#   trabajo de integracion.yml; se pasó aquí tal cual.
# Cuándo corre: a mano (Actions → Flujo de compra contra el servidor real →
#   Run workflow). La regresión completa de los martes
#   (regresion-completa.yml) corre la misma prueba.
# Si falla: no bloquea ningún Pull Request; avisa que algo cambió en el
#   servidor real o en la cuenta de prueba.
# Dónde ver el resultado: Actions → la corrida → Summary: cada escenario con
#   ✅ u ⏭️ (por ejemplo, el pago se omite fuera del horario de la tienda).
#   El reporte queda en Artifacts («resultados-flujo-compra»).
# Cuenta de prueba: su correo y contraseña son los secretos USUARIO_PRUEBA y
#   CLAVE_PRUEBA (Settings → Secrets and variables → Actions); nunca se
#   escriben en el código. Sin ellos, el flujo de compra se omite.
# Dónde está la prueba: integration_test/flujos/compra_test.dart.
# Issue: #58 (Sprint 2).
# ─────────────────────────────────────────────────────────────────────────────
name: Flujo de compra contra el servidor real

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # El mismo celular virtual que integracion.yml, así reutilizan el que ya
  # está guardado.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  flujos:
    name: Flujo de compra contra el servidor real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Los primeros pasos preparan la computadora y el celular virtual (más
    # detalle en integracion.yml).
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # El servidor (plan gratuito de Render) se duerme si nadie lo usa y
      # tarda cerca de un minuto en despertar. Se le hace una consulta de solo
      # lectura antes de la prueba y se reintenta hasta que conteste.
      - name: Despertar el servidor
        run: >
          curl --silent --show-error --fail --output /dev/null
          --retry 5 --retry-delay 10 --retry-all-errors --max-time 90
          https://pier-reposteria-backend.onrender.com/api/pagos/config

      # Corre el flujo de compra en el celular virtual con la cuenta de prueba
      # (los secretos llegan como variables y se pasan con --dart-define).
      # tr -d '\r\n' quita los saltos de renglón que se cuelan al pegar un
      # secreto en GitHub: con uno de ellos, flutter test no reconoce la
      # opción y la confunde con un archivo de prueba.
      # -timezone pone el celular en hora de México: el botón «Pagar» solo
      # funciona en el horario de la tienda (Lun–Sáb, 9:00–21:00) y la
      # computadora de GitHub usa la hora universal (UTC), 6 horas adelante.
      - name: Correr el flujo de compra en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          USUARIO_PRUEBA: ${{ secrets.USUARIO_PRUEBA }}
          CLAVE_PRUEBA: ${{ secrets.CLAVE_PRUEBA }}
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -timezone America/Mexico_City ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test/flujos --no-pub --dart-define=USUARIO_PRUEBA="$(printf '%s' "$USUARIO_PRUEBA" | tr -d '\r\n')" --dart-define=CLAVE_PRUEBA="$(printf '%s' "$CLAVE_PRUEBA" | tr -d '\r\n')" --file-reporter json:build/resultados/flujos.json

      # Escribe el resumen: cada escenario con ✅ u ⏭️ (por ejemplo, el pago
      # se omite fuera del horario de la tienda).
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/flujos.json
          --titulo "Flujo de compra contra el servidor real"
          --detalle

      # Guarda el reporte 30 días en Artifacts. Corre siempre (if: always()),
      # también si falló: es la evidencia, y el job sigue fallando por el
      # paso que falló.
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-flujo-compra
          path: build/resultados/flujos.json
          if-no-files-found: warn
          retention-days: 30
