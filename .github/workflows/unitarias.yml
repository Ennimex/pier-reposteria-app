# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS UNITARIAS
#
# Qué prueba: cada pieza de la app por separado (validadores, ViewModels,
#   repositorios, providers y los widgets de cada pantalla) con datos
#   simulados: sin red, sin backend y sin emulador, gracias a FakeApiClient.
# Para qué sirve: comprobar en segundos que un cambio no rompió ninguna
#   pieza. Es la primera red de seguridad y mide la cobertura del código.
# Cuándo corre: al abrir o actualizar un Pull Request hacia main, en cada
#   push a main y a mano.
# Si falla: el Pull Request queda bloqueado (check obligatorio del ruleset
#   «Proteger main»).
# Resultados: en el resumen de la corrida (pestaña Summary): cuántas pruebas
#   pasaron, el error de cada una que falle y la cobertura por carpeta (#157).
# Dónde viven: test/unitarias/<épica>/ (lógica), test/widget/<pantalla>/
#   (widgets) y los tres archivos de la raíz de test/ (arranque y versión de
#   la app). Las de aceptación (test/aceptacion/) tienen su propio pipeline.
# Issues: #15, #16 y #17 (Sprint 1), #54 y #55 (Sprint 2), #63 (Sprint 4)
#   y #67 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas unitarias

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Si llega otro commit al mismo Pull Request, se cancela la corrida anterior.
concurrency:
  group: unitarias-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  unitarias:
    name: Unitarias y de widget, con cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Se listan las carpetas a propósito para no repetir aquí las pruebas de
      # aceptación (test/aceptacion/), que corren en aceptacion.yml.
      # --coverage escribe en coverage/lcov.info qué líneas se ejecutaron.
      # --file-reporter guarda además el resultado de cada prueba en JSON
      # para el resumen, sin cambiar lo que se ve en el log.
      - name: Correr las pruebas unitarias y de widget
        run: >
          flutter test --coverage
          --file-reporter json:build/resultados/unitarias.json
          test/unitarias
          test/widget
          test/app_test.dart
          test/app_version_test.dart
          test/app_widget_test.dart

      # Totales, pruebas que fallaron con su error y cobertura por carpeta en
      # el resumen de la corrida. Corre aunque fallen pruebas.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/unitarias.json
          --titulo "Pruebas unitarias y de widget"
          --cobertura coverage/lcov.info
