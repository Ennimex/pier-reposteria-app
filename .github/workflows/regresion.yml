# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE REGRESIÓN (bugs ya corregidos)
#
# Qué revisa: que no vuelva ninguno de los bugs que ya se corrigieron. Cada
#   bug cerrado tiene al menos una prueba que falla si el bug regresa, marcada
#   con la etiqueta «regresion» (dart_test.yaml):
#     #87 (conteo de flutter analyze en Linux), #111 («agregado» aunque el
#     alta falle), #112 (texto técnico sin conexión), #118 (motivo del
#     reembolso como texto), #126 y #140 (hornos y decoración en la tienda),
#     #155 (versiones viejas de las acciones), #160 y #162 (catálogo sin
#     conexión) y #185 (mediciones de rendimiento en el emulador).
#   Las pruebas viven donde ya estaban (test/unitarias, test/widget,
#   test/aceptacion); las de los bugs que no tenían, en test/regresion/.
# Cómo lo hace: flutter test --tags regresion corre, de toda la carpeta test/,
#   solo las que llevan la etiqueta. Sin red: usan el servidor de mentira.
# Cuándo corre: es la tercera etapa de pipeline.yml, junto con la
#   integración, después de las pruebas de aceptación: en cada Pull Request
#   y cada vez que algo se une a main. Además, sola, el martes de cierre de
#   cada sprint a las 09:30 de México, con cada versión nueva (tag v*) y a
#   mano. La regresión completa, con el servidor real y el APK, está en
#   regresion-completa.yml.
# Si falla: el pipeline se detiene y GitHub no deja unir el Pull Request: un
#   bug corregido volvió.
# Dónde ver el resultado: Actions → la corrida → Summary: cada prueba con ✅;
#   si alguna falla, la tabla de evidencias del pipeline dice cuál. El
#   reporte queda en Artifacts («resultados-regresion»).
# Issues: #59 (Sprint 2), #62 (Sprint 3), #66 (Sprint 4) y #72 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de regresión

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
  schedule:
    # Minuto 30, hora 15 UTC, en martes (2): las 09:30 de México, a la misma
    # hora que la regresión completa.
    - cron: '30 15 * * 2'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  regresion:
    name: Bugs corregidos (etiqueta regresion)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los tres primeros pasos preparan la computadora que presta GitHub:
    # descargan el código, instalan Flutter y las librerías que usa la app.
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Corre solo las pruebas con la etiqueta «regresion». --reporter
      # expanded escribe cada una en el registro conforme pasa y
      # --file-reporter guarda el resultado, con el que se arma el resumen.
      - name: Correr las pruebas de regresión
        run: >
          flutter test --tags regresion --reporter expanded
          --file-reporter json:build/resultados/regresion.json

      # Escribe el resumen: cada prueba con ✅. Si alguna falló, el paso
      # anterior ya detuvo el job y la tabla de evidencias del pipeline dice
      # cuál, con el reporte que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/regresion.json
          --titulo "Regresión: bugs ya corregidos"
          --detalle

      # Guarda el reporte 30 días en Artifacts. Corre siempre (if: always()),
      # también si falló una prueba: es la evidencia, y el job sigue fallando
      # por el paso que falló.
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-regresion
          path: build/resultados/regresion.json
          if-no-files-found: warn
          retention-days: 30
