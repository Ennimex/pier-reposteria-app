# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PUBLICAR UNA VERSIÓN
#
# Qué hace, en dos trabajos encadenados:
#   1. Pruebas en el entorno de liberación: levanta el mismo entorno aislado
#      de las pruebas (tool/entorno_pruebas.sh: la API del backend y su base
#      en contenedores, con datos ficticios), construye el candidato de
#      liberación en modo release apuntando a ese entorno, lo instala en un
#      celular Android virtual (emulador) y corre el smoke: la app abre,
#      carga el catálogo e inicia sesión (tool/smoke_liberacion.dart).
#      También arma el AAB (el paquete que pide Google Play) para comprobar
#      que compila; ese no se publica.
#   2. APK firmado y Release: solo si las pruebas pasaron y alguien con
#      permiso lo aprueba en el Environment «produccion» (Settings →
#      Environments: aprobación requerida y solo tags v*). Arma el APK y el
#      AAB finales (release), los firma con la llave del equipo, con Sentry
#      encendido, los publica en GitHub Releases con la lista de cambios desde
#      la versión anterior y revisa, sin escribir nada, que el servidor de
#      producción responda. El AAB es el que se sube a Play Console
#      (docs/PLAY_STORE.md).
# Para qué sirve: que ninguna versión llegue a los celulares de los dueños
#   (grupo canary) sin haberse probado antes como versión de release y sin
#   una aprobación explícita. La estrategia completa está en
#   docs/LIBERACION.md.
# Cuándo corre: al subir un tag vX.Y.Z (git tag v1.2.0 && git push origin
#   v1.2.0). También a mano (Actions → Publicar versión → Run workflow) en
#   modo ensayo (activado por omisión): corre las pruebas en el entorno de
#   liberación y no publica nada, sin crear tags. Sin ensayo, la publicación
#   pide el Environment «produccion», que solo acepta tags v*.
# Antes de crear el tag: subir la versión en pubspec.yaml y en
#   lib/config/app_version.dart. Si el tag no coincide, no se publica nada.
# Secretos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   la llave (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD la contraseña de la llave (storePassword)
#   ANDROID_KEY_ALIAS         el alias (keyAlias)
#   ANDROID_KEY_PASSWORD      la contraseña del alias (keyPassword)
#   SENTRY_DSN                el DSN del proyecto flutter en Sentry (#23)
#   Sin los cuatro de la llave el workflow se detiene: nunca publica un APK
#   firmado con la llave de pruebas.
#   Las pruebas en el entorno de liberación no usan ningún secreto: el
#   candidato apunta al contenedor y se firma con la llave de pruebas.
# Si falla: no se publica nada. Revisa el paso en rojo; el Summary explica si
#   fue el smoke del candidato (con sus capturas en Artifacts), la versión,
#   la llave, la firma o el servidor de producción.
# Dónde ver el resultado: la Release en la página del repositorio (con el APK
#   y el AAB adjuntos) y, en la corrida, el Summary con el smoke del
#   candidato y las notas de la versión.
# Issues: #22 (este pipeline), #23 (Sentry), #24 (métricas para decidir el
#   rollout), #203 (entorno de liberación y aprobación).
# ─────────────────────────────────────────────────────────────────────────────
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ensayo:
        description: 'Ensayo: corre las pruebas en el entorno de liberación y no publica nada'
        type: boolean
        default: true

# Las pruebas solo leen el código; el trabajo que publica pide además
# permiso de escribir (la Release).
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # El celular virtual, el mismo de las pruebas de integración: Android 14
  # (API 34) con las medidas de un Pixel 6, sin ventana ni sonido.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
  # El servidor del entorno aislado visto desde el emulador.
  URL_ENTORNO_LIBERACION: http://10.0.2.2:3000/api
  # Huella SHA-1 de la llave de release del equipo (es pública: la misma que
  # está registrada en Google Cloud para el inicio con Google).
  HUELLA_RELEASE: F3:A4:02:DF:C1:97:80:28:A1:D4:17:23:66:40:2C:64:AD:C3:B0:C1

jobs:
  pruebas-entorno-liberacion:
    name: Pruebas en el entorno de liberación
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Los primeros pasos preparan la computadora que presta GitHub: el
    # código, Java (para armar el APK y para el emulador), Flutter y las
    # librerías de la app.
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # El entorno de liberación: el mismo entorno aislado de las pruebas,
      # generado por tool/entorno_pruebas.sh (.github/actions/entorno-aislado
      # descarga el backend al commit fijo y enciende la API y la base en
      # contenedores). Queda en el puerto 3000 de esta computadora, que el
      # emulador ve como 10.0.2.2.
      - name: Levantar el entorno de liberación
        uses: ./.github/actions/entorno-aislado

      # El candidato de liberación: la app en modo release (compilada, con
      # el código reducido y sin herramientas de depuración, como la que se
      # publica), flavor prod, apuntando al entorno de liberación. Sin
      # SENTRY_DSN, para que las pruebas no manden errores a Sentry, y sin la
      # llave del equipo: Gradle lo firma con la de pruebas. Produce
      # build/app/outputs/flutter-apk/app-prod-release.apk.
      - name: Compilar el candidato de liberación
        run: |
          flutter build apk --release --flavor prod --dart-define=API_BASE_URL="$URL_ENTORNO_LIBERACION"
          candidato=build/app/outputs/flutter-apk/app-prod-release.apk
          echo "### 📦 Candidato de liberación: APK de release ($(du -h "$candidato" | cut -f1)) contra $URL_ENTORNO_LIBERACION" >> "$GITHUB_STEP_SUMMARY"

      # El paquete que pide Google Play (#226), armado igual que el candidato
      # para que el ensayo compruebe que compila: lleva el manifiesto y el
      # código de la app para las tres arquitecturas. Se firma con la llave
      # de pruebas y no se publica; el firmado con la llave del equipo sale
      # en «APK firmado y Release». Produce
      # build/app/outputs/bundle/prodRelease/app-prod-release.aab.
      - name: Comprobar que el AAB se arma
        run: |
          flutter build appbundle --release --flavor prod --dart-define=API_BASE_URL="$URL_ENTORNO_LIBERACION"
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          contenido=$(unzip -l "$aab")
          faltan=""
          for parte in base/manifest/AndroidManifest.xml base/lib/arm64-v8a/libapp.so \
            base/lib/armeabi-v7a/libapp.so base/lib/x86_64/libapp.so; do
            if ! grep -q " $parte$" <<< "$contenido"; then
              faltan="$faltan $parte"
            fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Al AAB le falta:$faltan"
            echo "### ❌ Al AAB le falta:$faltan" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### 📦 AAB armado ($(du -h "$aab" | cut -f1)): manifiesto y código para arm64-v8a, armeabi-v7a y x86_64" >> "$GITHUB_STEP_SUMMARY"

      # El celular virtual, igual que en las pruebas de integración: KVM
      # para que el emulador use el procesador directamente y el AVD
      # guardado en la caché entre corridas.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Instala el candidato en el emulador y corre el smoke
      # (tool/smoke_liberacion.dart): abre la app, la pestaña «Catálogo»
      # muestra un producto de la semilla y, desde «Más» → «Iniciar Sesión»,
      # entra con la cuenta de la semilla hasta que el Inicio saluda «Hola,
      # Cliente». La cuenta es ficticia, solo existe en el contenedor y no es
      # un secreto: si la app hablara con otro servidor, no podría entrar.
      # Si Android avisa que otra app del emulador no responde (su lanzador
      # a veces se congela al encender), el smoke toca «Wait» y sigue; si el
      # aviso es de Pier (--app), falla.
      # Deja las capturas de cada paso y smoke_liberacion.json en
      # build/resultados/smoke_liberacion/ y la tabla en el Summary.
      # Pase o falle, guarda después las bitácoras de los contenedores, y el
      # renglón termina con el código del smoke: si falla, el trabajo falla
      # y no se publica nada. Va en un solo renglón (>) porque el emulador
      # corre cada renglón por separado.
      - name: Instalar el candidato y correr el smoke en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: >
            mkdir -p build/resultados/smoke_liberacion;
            if adb install -r build/app/outputs/flutter-apk/app-prod-release.apk
            && dart run tool/smoke_liberacion.dart mx.com.pierreposteria
            build/resultados/smoke_liberacion --app Pier
            --usuario cliente@pier.test --clave Chocoflan-Prueba-2026
            --producto Chocoflan --saludo "Hola, Cliente";
            then codigo_del_smoke=0; else codigo_del_smoke=$?; fi;
            bash tool/entorno_pruebas.sh logs > build/resultados/smoke_liberacion/entorno_logs.txt;
            exit "$codigo_del_smoke"

      # Guarda las capturas, el reporte y las bitácoras de los contenedores
      # 30 días en Artifacts. Corre siempre (if: always()), también si el
      # entorno no arrancó o el smoke falló: es la evidencia, y el trabajo
      # sigue fallando por el paso que falló.
      - name: Guardar las evidencias del smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-entorno-liberacion
          path: |
            build/resultados/smoke_liberacion/
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30

  publicar:
    name: APK firmado y Release
    # Solo con el candidato probado en el entorno de liberación.
    needs: pruebas-entorno-liberacion
    # En modo ensayo el workflow termina con las pruebas y no publica nada.
    # Esto no salta ninguna prueba: el smoke del candidato ya corrió.
    if: ${{ !inputs.ensayo }}
    # El Environment «produccion» detiene el trabajo hasta que alguien con
    # permiso apruebe la publicación (Settings → Environments) y solo
    # acepta tags v*. La URL lleva a la Release de esta versión.
    environment:
      name: produccion
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Con todo el historial y los tags, para encontrar la versión anterior.
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # El nombre de la versión: el tag, o «prueba-<commit>» si se corrió a
      # mano.
      - name: Nombre de la versión
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "nombre=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "nombre=prueba-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # «Acerca de» muestra la versión del pubspec: si el tag dice otra cosa,
      # la Release mentiría.
      - name: Comprobar que el tag sea la versión del pubspec
        if: github.ref_type == 'tag'
        run: dart run tool/resumen_pruebas.dart version "$GITHUB_REF_NAME"

      # android/app/build.gradle.kts firma con la llave que diga
      # android/key.properties; aquí se arma ese archivo con los secretos.
      - name: Preparar la llave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltan=""
          for secreto in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secreto}" ]; then
              faltan="$faltan $secreto"
            fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos de la llave:$faltan"
            echo "### ❌ Faltan secretos de la llave:$faltan" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/llave-release.jks
          {
            echo "storeFile=llave-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Compilar el APK de release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::Sin SENTRY_DSN: esta versión no reportará errores a Sentry."
          fi
          flutter build apk --release --flavor prod --dart-define=SENTRY_DSN="$SENTRY_DSN"

      # Si la llave no se cargó, Gradle firma con la de pruebas sin avisar.
      # Se compara la huella del APK con la del equipo antes de publicarlo.
      - name: Verificar que el APK lleve la firma del equipo
        env:
          VERSION: ${{ steps.version.outputs.nombre }}
        run: |
          apk=build/app/outputs/flutter-apk/app-prod-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          huella=$("$apksigner" verify --print-certs "$apk" \
            | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ "$huella" != "$HUELLA_RELEASE" ]; then
            echo "::error::El APK no está firmado con la llave del equipo (huella $huella)."
            echo "### ❌ El APK no está firmado con la llave del equipo" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp "$apk" "build/pier-reposteria-$VERSION.apk"
          echo "### 🔏 APK firmado con la llave del equipo ($(du -h "$apk" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # El AAB para Google Play (#226), con la misma llave y Sentry: es el
      # que se sube a Play Console (docs/PLAY_STORE.md). Con Play App Signing
      # esta llave es la de subida y Google firma lo que llega a los
      # celulares con la suya.
      - name: Compilar el AAB de release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build appbundle --release --flavor prod --dart-define=SENTRY_DSN="$SENTRY_DSN"

      # Igual que con el APK: si la llave no se cargó, el AAB saldría firmado
      # con la de pruebas y Play Console lo rechazaría.
      - name: Verificar que el AAB lleve la firma del equipo
        env:
          VERSION: ${{ steps.version.outputs.nombre }}
        run: |
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          huella=$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA1:' | awk '{print $NF}')
          if [ "$huella" != "$HUELLA_RELEASE" ]; then
            echo "::error::El AAB no está firmado con la llave del equipo (huella $huella)."
            echo "### ❌ El AAB no está firmado con la llave del equipo" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp "$aab" "build/pier-reposteria-$VERSION.aab"
          echo "### 🔏 AAB firmado con la llave del equipo ($(du -h "$aab" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Los commits desde el tag anterior (Conventional Commits), agrupados en
      # Nuevo, Correcciones y Mantenimiento. También quedan en el Summary.
      - name: Notas de la versión
        env:
          VERSION: ${{ steps.version.outputs.nombre }}
        run: |
          # El tag anterior: el más cercano al commit previo. Si el
          # repositorio aún no tiene tags, las notas toman toda la historia.
          if [ -n "$(git tag --list 'v*')" ]; then
            anterior=$(git describe --tags --abbrev=0 HEAD^)
          else
            anterior=""
          fi
          mkdir -p build/resultados
          git log --format=%s "${anterior:+$anterior..}HEAD" > build/resultados/commits.txt
          dart run tool/resumen_pruebas.dart notas "$VERSION" \
            build/resultados/commits.txt > build/resultados/notas.md

      - name: Publicar la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Pier Repostería ${{ github.ref_name }}
          body_path: build/resultados/notas.md
          files: |
            build/pier-reposteria-${{ github.ref_name }}.apk
            build/pier-reposteria-${{ github.ref_name }}.aab
          fail_on_unmatched_files: true

      # Corrida a mano: el APK y el AAB firmados quedan 7 días en Artifacts,
      # sin Release.
      - name: Guardar el APK de prueba
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.version.outputs.nombre }}
          path: |
            build/pier-reposteria-*.apk
            build/pier-reposteria-*.aab
          if-no-files-found: error
          retention-days: 7

      # Después de publicar: la versión nueva habla con el servidor de
      # producción. Se revisa, sin escribir nada, que responda: GET
      # /api/health debe dar 200 (la base responde). curl reintenta las
      # respuestas pasajeras (408, 429 y 5xx) y los errores de conexión,
      # porque el servidor gratuito tarda en despertar, y escribe el código
      # HTTP final. Si no conecta o no da 200, el trabajo falla y el Summary
      # lo dice.
      - name: Revisar que producción responda (solo lectura)
        run: |
          url_de_salud=https://pier-reposteria-backend.onrender.com/api/health
          if ! codigo_http=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --retry 5 --retry-delay 10 \
            --retry-all-errors --max-time 90 "$url_de_salud"); then
            echo "::error::No se pudo conectar con producción ($url_de_salud)."
            echo "### ❌ No se pudo conectar con producción (GET /api/health)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$codigo_http" != 200 ]; then
            echo "::error::Producción no respondió 200 en $url_de_salud (respondió $codigo_http)."
            echo "### ❌ Producción respondió $codigo_http en GET /api/health" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Producción responde: GET /api/health → 200" >> "$GITHUB_STEP_SUMMARY"
