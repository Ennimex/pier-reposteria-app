# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE REGRESIÓN
#
# Qué revisa: que lo nuevo no rompió lo que ya funcionaba. Vuelve a correr
#   TODAS las pruebas acumuladas (integración en el emulador, análisis del
#   código, unitarias y aceptación) y arma el APK (el archivo que se instala
#   en el celular) de esa versión.
#   Ejemplo: si un cambio del Sprint 4 en el carrito rompe el inicio de
#   sesión que se entregó en el Sprint 1, aquí aparece.
# Para qué sirve: es el respaldo de cada entrega. El sprint se presenta con
#   la regresión en verde y su APK listo para instalar.
# Cuándo corre: sola, el martes de cierre de cada sprint a las 02:00 de
#   México (08:00 UTC); cuando se publica una versión nueva (v1.2.0,
#   v1.2.1…) y cuando alguien la lanza a mano.
# Si falla: abre sola un issue con la etiqueta bug en el tablero, con el
#   enlace a la corrida.
# Dónde ver el resultado: Actions → la corrida → Summary: una fila por etapa
#   con ✅, ❌ o ⏭️ (no corrió porque falló una anterior) y, debajo, las
#   pruebas que fallaron. El APK se descarga desde Artifacts.
# Issues: #59 (Sprint 2), #62 (Sprint 3), #66 (Sprint 4) y #72 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de regresión

on:
  schedule:
    # Minuto 0, hora 8 UTC, cualquier día del mes, cualquier mes, en martes (2).
    - cron: '0 8 * * 2'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # El mismo celular virtual que integracion.yml, así reutilizan el que ya
  # está guardado.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  regression:
    name: Full suite and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Deja que el emulador use el procesador directamente (más detalle en
      # integracion.yml).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Recupera el celular virtual guardado o, si no hay, lo crea (igual que
      # en integracion.yml).
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Etapa 1, integración: las pruebas de integration_test/ en el celular
      # virtual. Cada etapa guarda su resultado en build/resultados/ para el
      # resumen.
      - name: Correr las pruebas de integración en el emulador
        id: integracion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test --no-pub --file-reporter json:build/resultados/integracion.json

      # Etapa 2, análisis del código contra la línea base (como en
      # analisis-estatico.yml).
      - name: Comparar flutter analyze con la línea base
        id: analisis
        run: bash tool/check_analysis.sh

      # Etapa 3, todas las pruebas de la carpeta test/ (unitarias, de widget
      # y de aceptación), con su cobertura.
      - name: Correr la suite completa con cobertura
        id: suite
        run: flutter test --coverage --file-reporter json:build/resultados/suite.json

      # Etapa 4, el APK de la versión probada. Sin --flavor se arma la versión
      # de producción (#12).
      - name: Compilar el APK de depuración
        id: apk
        run: flutter build apk --debug

      # Escribe el resumen: una fila por etapa con su resultado y, debajo, las
      # pruebas que fallaron. Corre aunque falle una etapa.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        run: >
          dart run tool/resumen_pruebas.dart regresion
          --integracion ${{ steps.integracion.outcome }}
          --analisis ${{ steps.analisis.outcome }}
          --suite ${{ steps.suite.outcome }}
          --apk ${{ steps.apk.outcome }}

      # Guarda el APK 30 días en la pestaña Artifacts de la corrida, para
      # instalarlo en la revisión de cierre de sprint. Es lo único que se
      # guarda como archivo: los resultados ya están en el resumen.
      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 30

  avisar:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: regression
    # Solo corre si la regresión falló.
    if: failure()
    permissions:
      issues: write
    steps:
      # Crea el issue con el permiso automático que GitHub le da al workflow:
      # no usa la cuenta ni la contraseña de nadie.
      - name: Abrir el issue de regresión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Regresión fallida: ${{ github.ref_name }} (run ${{ github.run_number }})" \
            --label bug \
            --body "La suite de regresión falló en \`${{ github.ref_name }}\` (${{ github.event_name }}, commit ${{ github.sha }}). Revisa el log: $RUN_URL"
