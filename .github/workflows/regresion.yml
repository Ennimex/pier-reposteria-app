name: Regresión

on:
  schedule:
    - cron: '0 8 * * 2'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Full suite and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test --no-pub

      - name: Check static analysis against baseline
        run: bash tool/check_analysis.sh

      - name: Run complete test suite with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 30
