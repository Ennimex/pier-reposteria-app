# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE RENDIMIENTO
#
# Qué revisa: cosas que el usuario nota aunque no sepa nombrarlas.
#   · Cuánto pesa la app al descargarla (el APK). Ejemplo: si alguien agrega
#     imágenes sin comprimir, el peso sube y aquí se ve cuánto y dónde. No
#     puede crecer más de 10 % sobre la línea base.
#   · Cuánto tarda en abrir en frío en un celular virtual (emulador), hasta
#     el primer cuadro (am start -W). Para medir el cambio y no la velocidad
#     de la computadora que tocó, se compara con develop en el mismo
#     emulador: tool/arranque_alternado.sh instala y abre una y otra app en
#     7 rondas (las impares empiezan por develop y las pares por este cambio)
#     y cada vez tira la primera apertura después de instalar, que es más
#     lenta. Falla si la mediana de este cambio sube más de 20 % y además más
#     de 25 ms sobre la de develop. El APK de develop no se compila aquí: lo
#     guarda cada push a develop (14 días) y aquí se descarga. Si no hay uno
#     vigente, la app se abre 1 vez sin contar y 7 contadas, y decide la
#     línea base fija. La app habla con la API del entorno aislado
#     (contenedores, nunca producción), así que el tiempo no depende de la
#     red.
#   · Cuánto tarda la API en contestar con carga normal: k6
#     (pruebas/k6/rendimiento.js) manda 10 clientes a la vez contra la API
#     del entorno aislado. El 95 % de las respuestas (p95) debe llegar en
#     menos de 800 ms, con menos del 1 % de errores.
#   El peso, la API y, sin APK de develop, el arranque se comparan con su
#   línea base en tool/linea_base_rendimiento.json: un tiempo falla solo si
#   sube más de 20 % y además más de 25 ms (el piso evita fallar por el
#   ruido de las computadoras de GitHub); el APK, si crece más de 10 %. Con
#   el APK de develop, el arranque usa esa misma regla contra develop y la
#   línea base solo se muestra en el resumen.
# Para qué sirve: comparar cada versión con la medición de referencia y
#   descubrir si la app se volvió más lenta o más pesada ANTES de
#   publicarla.
# Cuándo corre: es la cuarta etapa de pipeline.yml, junto con las pruebas de
#   esfuerzo, después de la integración y la regresión: en cada Pull Request
#   y cada vez que algo se une a develop (de ahí sale el APK de develop) o a
#   main. También sola con cada versión nueva
#   (tag vX.Y.Z) y a mano (Actions → Pruebas de rendimiento → Run workflow).
#   k6 dura 30 s en los Pull Requests y 1 min con la casilla «completo».
# Dónde corre: todo en las computadoras que presta GitHub. La fluidez por
#   cuadro y el arranque en el Samsung SM-N975U del equipo (1.6 s, la
#   referencia de #61) solo se miden bien en un celular de verdad: eso vive
#   aparte, en rendimiento-celular.yml, que se lanza a mano.
# Si falla: el pipeline falla y GitHub no deja unir el Pull Request; en una
#   versión, no se publica hasta revisar el resultado.
# Dónde ver el resultado: Actions → la corrida → Summary: el peso total y qué
#   ocupa más espacio dentro del APK; cada ronda del arranque con el tiempo
#   de este cambio y el de develop, las dos medianas y su diferencia; la
#   tabla de k6, y cada medición contra develop o su línea base. El APK, las
#   aperturas (las contadas de este cambio y de develop, las descartadas y de
#   qué corrida salió el APK de develop) y el resumen de k6 se descargan
#   desde Artifacts.
# Issues: #61 (Sprint 3, medición de referencia) y #71 (Sprint 5, versión
#   candidata).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de rendimiento

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a develop o a
  # main.
  workflow_call:
    inputs:
      completo:
        description: k6 con toda su duración (1 min) en vez de la reducida (30 s)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      completo:
        description: k6 con toda su duración (1 min) en vez de la reducida (30 s)
        type: boolean
        default: false
  # Cada versión nueva: el peso, el arranque y la API se comparan con su
  # línea base (tool/linea_base_rendimiento.json).
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # Nombre con el que Android identifica a la app (versión de producción,
  # la que se arma sin --flavor; ver android/app/build.gradle.kts).
  PAQUETE: mx.com.pierreposteria
  # El mismo celular virtual que integracion.yml, así reutilizan el que ya
  # está guardado.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  peso-del-apk:
    name: Peso del APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Quita de la imagen lo que no se usa (.NET, Haskell, CodeQL y Boost)
      # para que compilar el APK no se quede sin disco; no toca el SDK de
      # Android (.github/actions/liberar-disco).
      - name: Liberar disco
        uses: ./.github/actions/liberar-disco

      # Java hace falta para armar el APK.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Arma el APK final (release), igual al que se publicaría, y desglosa qué
      # ocupa espacio dentro: el motor de Flutter, el código de la app, las
      # imágenes… Solo para procesadores arm64, los de los celulares actuales
      # como el del equipo. En GitHub no está la llave de firma del equipo,
      # así que se firma con la de pruebas; el peso es el mismo.
      - name: Compilar el APK de release y analizar su peso
        run: flutter build apk --release --analyze-size --target-platform android-arm64

      # Falla si el APK pesa más de 10 % sobre la línea base
      # (tool/linea_base_rendimiento.json, escenario app_peso_apk).
      - name: Comparar el peso con la línea base
        run: bash tool/comparar_rendimiento.sh build/app/outputs/flutter-apk/app-prod-release.apk app_peso_apk

      # Escribe el resumen: el peso total, lo que más ocupa dentro del APK y
      # las librerías que más pesan. Llega aquí solo si el APK se armó.
      - name: Mostrar el resultado en el resumen
        run: dart run tool/resumen_pruebas.dart peso

      # Guarda el APK medido 30 días en Artifacts, por si hay que instalarlo;
      # el resultado de la medición ya está en el resumen.
      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

  carga-api:
    name: Carga normal de la API (k6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Flutter hace falta para tool/resumen_pruebas.dart, que compara con la
      # línea base y escribe el resumen.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Descarga el backend al commit fijo y enciende la API y la base en
      # contenedores (.github/actions/entorno-aislado). Este trabajo tiene su
      # propio entorno: no lo comparte con ningún otro.
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # La misma versión de k6 en todas las corridas.
      - name: Instalar k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      # Cuánto dura la carga: 30 s en los Pull Requests y 1 min con la casilla
      # «completo». Cambia la duración, no si la prueba corre.
      - name: Elegir la duración de la carga
        id: carga
        env:
          CARGA_COMPLETA: ${{ inputs.completo }}
        run: |
          if [ "$CARGA_COMPLETA" = "true" ]; then
            duracion=1m
          else
            duracion=30s
          fi
          echo "duracion=$duracion" >> "$GITHUB_OUTPUT"
          echo "k6 durará $duracion."

      # Corre k6 contra la API del contenedor. Si un umbral no se cumple
      # (p95 de 800 ms, 1 % de errores, ningún 429), k6 termina con error y el
      # paso falla. Pase o falle, guarda las bitácoras de los contenedores.
      - name: Correr la carga normal con k6
        env:
          DURACION: ${{ steps.carga.outputs.duracion }}
        run: |
          mkdir -p build/resultados
          if k6 run --summary-export build/resultados/k6_rendimiento.json \
            --env API_BASE_URL=http://localhost:3000/api --env DURACION="$DURACION" \
            pruebas/k6/rendimiento.js; then
            codigo_de_k6=0
          else
            codigo_de_k6=$?
          fi
          bash tool/entorno_pruebas.sh logs > build/resultados/entorno_logs.txt
          exit "$codigo_de_k6"

      # Falla si el p95 subió más de 20 % sobre la línea base
      # (tool/linea_base_rendimiento.json, escenario api_carga_normal).
      - name: Comparar el p95 con la línea base
        run: bash tool/comparar_rendimiento.sh build/resultados/k6_rendimiento.json api_carga_normal

      # Escribe el resumen: peticiones, errores y tiempos contra la línea base.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart k6
          build/resultados/k6_rendimiento.json
          --titulo "Carga normal de la API (k6)"
          --escenario api_carga_normal

      # Guarda el resumen de k6 y las bitácoras 30 días en Artifacts. Corre
      # siempre (if: always()): si falló, ahí está por qué, y el job sigue
      # fallando por el paso que falló.
      - name: Guardar el resumen de k6 y las bitácoras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-k6-rendimiento
          path: |
            build/resultados/k6_rendimiento.json
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30

  arranque-en-frio:
    name: Arranque en frío en el emulador
    runs-on: ubuntu-24.04
    # 7 rondas con dos instalaciones y cuatro aperturas cada una.
    timeout-minutes: 50
    # Además de leer el código, busca y descarga el APK de develop que guardó
    # otra corrida (los artefactos de Actions).
    permissions:
      contents: read
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Quita de la imagen lo que no se usa (.NET, Haskell, CodeQL y Boost)
      # para que compilar el APK no se quede sin disco; no toca el SDK de
      # Android (.github/actions/liberar-disco).
      - name: Liberar disco
        uses: ./.github/actions/liberar-disco

      # Java hace falta para armar el APK y para el emulador.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Descarga el backend al commit fijo y enciende la API y la base en
      # contenedores (.github/actions/entorno-aislado). Este trabajo tiene su
      # propio entorno: no lo comparte con ningún otro.
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # El mismo APK que usa monkey (esfuerzo.yml): versión de producción en
      # modo de depuración, apuntando a la API del contenedor. Al arrancar, la
      # app pide la configuración de pagos (GET /pagos/config) antes de
      # dibujar su primera pantalla (#198); con el contenedor contesta en
      # milisegundos, así que lo que se mide es la app y no la red.
      - name: Compilar el APK de depuración
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:3000/api

      # En cada push a develop guarda su APK 14 días: así los Pull Requests y
      # los pushes siguientes se miden contra develop sin compilarlo otra vez
      # (paso siguiente). Solo en develop: el APK de un Pull Request no es
      # referencia de nada.
      - name: Guardar el APK de develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: apk-arranque-develop
          path: build/app/outputs/flutter-apk/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Descarga el APK de develop más reciente que siga vigente: el último
      # que guardó un push a develop de este repositorio (no de un fork), sin
      # contar esta corrida. De qué corrida y commit salió queda en
      # build/resultados/arranque_develop_origen.txt. Si no hay ninguno
      # (expiró o develop todavía no lo guarda) o no se pudo descargar, no
      # falla: avisa y el arranque se compara con la línea base fija.
      - name: Descargar el APK de develop
        id: apk-develop
        env:
          GH_TOKEN: ${{ github.token }}
          CORRIDA: ${{ github.run_id }}
        run: |
          mkdir -p build/develop build/resultados
          if ! encontrado="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=apk-arranque-develop&per_page=100" --jq '
            [.artifacts[]
              | select(.expired | not)
              | select(.workflow_run.head_branch == "develop")
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
              | select(.workflow_run.id != ($ENV.CORRIDA | tonumber))]
            | sort_by(.created_at) | last
            | if . == null then "" else "\(.id) \(.workflow_run.id) \(.workflow_run.head_sha)" end')"; then
            echo "::notice::No se pudo consultar los artefactos de Actions: el arranque se compara con la línea base fija."
            exit 0
          fi
          if [ -z "$encontrado" ]; then
            echo "::notice::No hay un APK de develop vigente: el arranque se compara con la línea base fija."
            exit 0
          fi
          read -r artefacto corrida commit <<< "$encontrado"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artefacto/zip" > build/develop/apk.zip \
            || ! unzip -o -q build/develop/apk.zip -d build/develop \
            || [ ! -f build/develop/app-prod-debug.apk ]; then
            echo "::notice::No se pudo descargar el APK de develop (artefacto $artefacto): el arranque se compara con la línea base fija."
            exit 0
          fi
          rm build/develop/apk.zip
          echo "APK de develop: corrida $corrida, commit $commit ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$corrida)." \
            | tee build/resultados/arranque_develop_origen.txt
          echo "apk=build/develop/app-prod-debug.apk" >> "$GITHUB_OUTPUT"

      # El celular virtual (más detalle en integracion.yml).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Con el APK de develop, 7 rondas en las que este cambio y develop se
      # turnan (tool/arranque_alternado.sh): cada vez desinstala, instala,
      # tira la primera apertura y cuenta la segunda; las rondas impares
      # empiezan por develop. Sin él, 1 apertura descartada y 7 contadas de
      # este cambio. Cada apertura la hace tool/arranque_en_frio.sh, que
      # cierra la app por completo antes y falla si no muestra su ventana. Lo
      # que reporta Android queda en build/resultados/ (arranque_en_frio.txt,
      # arranque_develop.txt y arranque_descartadas.txt); al final se guardan
      # las bitácoras de los contenedores.
      - name: Abrir en frío este cambio y develop, alternados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: |
            bash tool/arranque_alternado.sh ${{ env.PAQUETE }} 7 build/app/outputs/flutter-apk/app-prod-debug.apk build/resultados ${{ steps.apk-develop.outputs.apk }}
            bash tool/entorno_pruebas.sh logs > build/resultados/entorno_logs.txt

      # Escribe el resumen: cada ronda con el tiempo de este cambio y el de
      # develop, las dos medianas y su diferencia, cuántas aperturas se
      # descartaron, el veredicto contra develop y la línea base, que
      # entonces solo informa. Sin develop: cada apertura, la mediana y la
      # línea base. Va antes de la comparación para que el resumen salga
      # también cuando la comparación falla.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart arranque
          build/resultados/arranque_en_frio.txt
          --escenario app_arranque_emulador
          --develop build/resultados/arranque_develop.txt
          --descartadas build/resultados/arranque_descartadas.txt
          --origen build/resultados/arranque_develop_origen.txt

      # Falla si la mediana de este cambio sube más de 20 % y además más de
      # 25 ms sobre la de develop (la regla del escenario
      # app_arranque_emulador de tool/linea_base_rendimiento.json). Sin
      # aperturas de develop, sobre la línea base fija de ese escenario.
      - name: Comparar el arranque con develop
        run: >
          dart run tool/resumen_pruebas.dart comparar-arranque
          build/resultados/arranque_en_frio.txt app_arranque_emulador
          --develop build/resultados/arranque_develop.txt

      # Guarda todas las aperturas (las contadas de este cambio y de develop,
      # las descartadas y de dónde salió el APK de develop) y las bitácoras
      # 30 días en Artifacts. Corre siempre (if: always()): si falló, ahí
      # está por qué, y el job sigue fallando por el paso que falló.
      - name: Guardar las aperturas y las bitácoras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-arranque
          path: |
            build/resultados/arranque_en_frio.txt
            build/resultados/arranque_develop.txt
            build/resultados/arranque_descartadas.txt
            build/resultados/arranque_develop_origen.txt
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30
