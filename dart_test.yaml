# Configuración de flutter test para todo el proyecto.
#
# Etiquetas: agrupan pruebas que viven en carpetas distintas para correrlas
# juntas con --tags.
tags:
  # Pruebas que comprueban que un bug ya corregido no vuelva (#87, #111,
  # #112, #118, #126, #140, #155, #160, #162 y #185). Se marcan con
  # @Tags(['regresion']) en el archivo o con tags: 'regresion' en la prueba,
  # y las corre la etapa de regresión del pipeline:
  #   flutter test --tags regresion
  regresion: {}

  # Pruebas de la API real contra el entorno aislado (test/api/). Necesitan
  # los contenedores arriba (bash tool/entorno_pruebas.sh levantar), así que
  # un flutter test normal las omite con este motivo. La etapa de integración
  # del pipeline las corre con:
  #   flutter test --tags api --run-skipped --dart-define=API_BASE_URL=http://localhost:3000/api
  api:
    skip: "necesitan el entorno aislado: bash tool/entorno_pruebas.sh levantar"
