# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE INTEGRACIÓN
#
# Qué revisa: que las partes de la app funcionan juntas, con la app completa
#   instalada en un celular Android virtual (emulador) que corre dentro de la
#   computadora de GitHub. Las pruebas rápidas (smoke) abren la app, intentan
#   entrar con una contraseña incorrecta y cargan el catálogo, con el
#   servidor de mentira (FakeApiClient), sin tocar el servidor real.
# Para qué sirve: encuentra fallos que las pruebas por pieza no ven; por
#   ejemplo, una pantalla que no lleva a la siguiente o algo que solo falla
#   en un celular Android.
# Cuándo corre: es la tercera etapa de pipeline.yml, junto con la regresión,
#   después de las pruebas de aceptación: en cada Pull Request (la solicitud
#   para unir cambios a main, la versión oficial del código) y cada vez que
#   algo se une a main. También se puede lanzar sola, a mano.
# Ojo: el flujo de compra contra el servidor real (#58) ya no vive aquí: está
#   en flujo-compra.yml, fuera del pipeline de los Pull Requests (necesita
#   la cuenta de prueba y el servidor de producción), y en la regresión
#   completa de los martes (regresion-completa.yml).
# Si falla: el pipeline se detiene aquí y GitHub no deja unir el Pull
#   Request hasta que se corrija.
# Dónde ver el resultado: Actions → la corrida → Summary: cada prueba con ✅;
#   si alguna falla, la tabla de evidencias del pipeline dice cuál. El
#   reporte queda en Artifacts («resultados-integracion»).
# Dónde están las pruebas: integration_test/app_smoke_test.dart.
# Issues: #21 (Sprint 1), #58 (Sprint 2), #65 (Sprint 4) y #69 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de integración

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # El celular virtual: Android 14 (API 34) con las medidas de un Pixel 6,
  # sin ventana ni sonido porque nadie lo está mirando.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  emulator:
    name: Pruebas rápidas (smoke) en Android 14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Java hace falta para armar el APK (el archivo que se instala en el
      # celular) y para el emulador.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Deja que el emulador use el procesador directamente. Sin esto corre en
      # modo lento y tarda cinco minutos solo en encender (corrida 37573804253).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El celular virtual ya creado (AVD) se guarda entre corridas, porque
      # crearlo desde cero toma varios minutos. Con esto la corrida bajó de 23
      # a 8 minutos.
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      # Solo si no había uno guardado: crea el celular virtual, lo enciende una
      # vez y lo guarda para las siguientes corridas.
      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Enciende el celular virtual, instala la app y corre dentro de él las
      # pruebas rápidas. --no-pub evita volver a descargar las librerías y
      # --file-reporter guarda el resultado de cada prueba en un archivo, con
      # el que se arma el resumen.
      - name: Correr las pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test/app_smoke_test.dart --no-pub --file-reporter json:build/resultados/integracion.json

      # Escribe el resumen: cada prueba con ✅. Si alguna falló, el paso
      # anterior ya detuvo el job y la tabla de evidencias del pipeline dice
      # cuál, con el reporte que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/integracion.json
          --titulo "Pruebas de integración en el emulador (Android 14)"
          --detalle

      # Guarda el reporte 30 días en Artifacts. Corre siempre (if: always()),
      # también si falló una prueba: es la evidencia, y el job sigue fallando
      # por el paso que falló.
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-integracion
          path: build/resultados/integracion.json
          if-no-files-found: warn
          retention-days: 30
