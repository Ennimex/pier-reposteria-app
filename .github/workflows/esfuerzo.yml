# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE ESFUERZO
#
# Qué revisa: cómo se portan la app y la API cuando se les exige más de lo
#   normal. Tiene dos trabajos que corren al mismo tiempo:
#   · Uso aleatorio: monkey, una herramienta de Android, toca, desliza y
#     escribe al azar miles de veces sobre la app instalada en un celular
#     virtual (emulador): más rápido y con menos orden que cualquier persona.
#     La app habla con la API del entorno aislado (contenedores, nunca
#     producción). Los cierres y congelamientos se cuentan en logcat (los
#     mensajes del celular) y, al terminar, se comprueba que la app se
#     recupera: vuelve a abrir en frío (am start -W) y la API sigue
#     contestando /api/health con 200.
#   · Esfuerzo de la API: k6 (pruebas/k6/esfuerzo.js) sube los clientes,
#     los sostiene, llega a un pico de 25 y baja, contra la API del entorno
#     aislado (contenedores, nunca producción). Después del pico, un
#     escenario de recuperación con 2 clientes revisa que la API volvió a
#     contestar rápido (p95 < 500 ms, < 1 % de errores).
# Para qué sirve: comprobar que la app no se cierra sola ni se congela (el
#   aviso «La app no responde» de Android, llamado ANR) antes de publicarla
#   en Google Play, y que la API aguanta un pico y se recupera.
# Cuándo corre: es la cuarta etapa de pipeline.yml, junto con las pruebas de
#   rendimiento, después de la integración y la regresión: en cada Pull
#   Request y cada vez que algo se une a main, con 1,000 toques (versión
#   reducida); con la casilla «completo» del pipeline, 5,000. También a mano
#   (Actions → Pruebas de esfuerzo → Run workflow), eligiendo cuántos toques
#   dar (5,000 si no se cambia). k6 corre las fases a la mitad de su duración
#   en los Pull Requests y completas con la casilla «completo».
# Volumen de datos (#70: catálogo de 1,000 productos y carrito de 100
#   artículos) no está aquí: sus pruebas todavía no existen, así que vive en
#   esfuerzo-volumen.yml, que se lanza a mano, para no dejar un trabajo
#   omitido en cada Pull Request.
# Ojo: monkey usa la app normal, armada para hablar con la API del
#   contenedor (http://10.0.2.2:3000/api), así que lo que toque llega al
#   entorno aislado y nunca al servidor real. Como la app recién instalada no
#   tiene sesión iniciada, casi todo es navegar por el catálogo.
# Si falla: el pipeline falla y GitHub no deja unir el Pull Request.
# Dónde ver el resultado: Actions → la corrida → Summary: cuántos toques se
#   dieron, cuántas veces se cerró o se congeló la app, cuánto tardó en
#   volver a abrir y la tabla de k6 con la recuperación. La bitácora de
#   monkey, el logcat, la reapertura y el resumen de k6 quedan en Artifacts.
# Issue: #70 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de esfuerzo

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
    inputs:
      completo:
        description: Toda la carga (5,000 eventos) en vez de la reducida (1,000)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      eventos:
        description: Cantidad de eventos aleatorios de monkey
        default: '5000'
        required: false
      completo:
        description: k6 con las fases completas en vez de reducidas
        type: boolean
        default: false
  # Se activará al cerrar #70 (correr con cada versión nueva):
  # push:
  #   tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # Nombre con el que Android identifica a la app (versión de producción,
  # la que se arma sin --flavor; ver android/app/build.gradle.kts).
  PAQUETE: mx.com.pierreposteria
  # El mismo celular virtual que integracion.yml, así reutilizan el que ya
  # está guardado.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  monkey:
    name: Uso aleatorio (monkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Descarga el backend al commit fijo y enciende la API y la base en
      # contenedores (.github/actions/entorno-aislado). Queda en el puerto
      # 3000 de esta computadora, que el emulador ve como 10.0.2.2.
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # Arma el APK de la versión de producción (sin --flavor), que queda en
      # build/app/outputs/flutter-apk/app-prod-debug.apk, apuntando a la API
      # del contenedor: al arrancar, la app pide ahí la configuración de
      # pagos (GET /pagos/config), que contesta en milisegundos.
      - name: Compilar el APK de depuración
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:3000/api

      # Deja que el emulador use el procesador directamente (más detalle en
      # integracion.yml).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Recupera el celular virtual guardado o, si no hay, lo crea (igual que
      # en integracion.yml).
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Cuántos eventos lanza monkey: los que se pidan al lanzarlo a mano o,
      # desde pipeline.yml, 1,000 en cada Pull Request (versión reducida) y
      # 5,000 con la casilla «completo». Cambia la carga, no si la prueba
      # corre.
      - name: Elegir la cantidad de eventos
        id: carga
        env:
          EVENTOS_PEDIDOS: ${{ inputs.eventos }}
          CARGA_COMPLETA: ${{ inputs.completo }}
        run: |
          if [ -n "$EVENTOS_PEDIDOS" ]; then
            eventos="$EVENTOS_PEDIDOS"
          elif [ "$CARGA_COMPLETA" = "true" ]; then
            eventos=5000
          else
            eventos=1000
          fi
          echo "eventos=$eventos" >> "$GITHUB_OUTPUT"
          echo "monkey lanzará $eventos eventos."

      # Instala la app en el celular virtual y suelta a monkey:
      #   · -s 42 fija la «semilla»: cada corrida hace exactamente los mismos
      #     toques, así un error se puede repetir para estudiarlo.
      #   · --throttle 100 deja 100 ms entre toques, rápido pero posible.
      #   · --pct-syskeys 0 no usa los botones del sistema (Inicio, Atrás…),
      #     para que monkey no se salga de la app.
      # Antes, logcat se agranda a 16 MB (para que no se pierdan mensajes en
      # las corridas largas) y se vacía, y la app se abre con am start -W, que
      # espera a que su ventana aparezca e imprime cuánto tardó (TotalTime,
      # en arranque.txt): si en 10 s no apareció (Status: timeout), el paso
      # falla ahí, con ese motivo.
      # Lo que hace monkey se guarda en monkey.txt y los mensajes del celular
      # en logcat.txt. Si monkey reporta que la app se cerró (CRASH) o se
      # congeló (ANR / NOT RESPONDING), el paso falla.
      # Recuperación: la app se cierra y se vuelve a abrir en frío
      # (tool/arranque_en_frio.sh, que falla si no abre) y la API debe seguir
      # contestando /api/health con 200 (curl --fail); los dos resultados
      # quedan en recuperacion.txt. Al final se vuelve a guardar logcat, ya
      # con la reapertura, y las bitácoras de los contenedores.
      # Dos detalles: los reportes de monkey salen por la salida de errores,
      # por eso 2>&1 los junta antes de guardarlos; y cada renglón de este
      # script corre por separado, por eso cada revisión va en un solo
      # renglón.
      - name: Instalar la app y lanzar los eventos aleatorios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-prod-debug.apk
            adb logcat -G 16M
            adb logcat -c
            adb shell am start -W -n ${{ env.PAQUETE }}/.MainActivity | tee arranque.txt
            if grep -q "Status: timeout" arranque.txt; then echo "::error::La app no mostró su ventana en 10 s (am start -W); monkey no puede empezar."; exit 1; fi
            adb shell monkey -p ${{ env.PAQUETE }} -s 42 --throttle 100 --pct-syskeys 0 -v ${{ steps.carga.outputs.eventos }} 2>&1 | tee monkey.txt
            adb logcat -d -v time > logcat.txt
            if grep -qE "CRASH|ANR in|NOT RESPONDING" monkey.txt; then echo "::error::La app se cerró o dejó de responder bajo carga; revisa el resumen de la corrida."; exit 1; fi
            bash tool/arranque_en_frio.sh ${{ env.PAQUETE }} 1 recuperacion.txt
            curl --silent --show-error --fail --max-time 10 --output /dev/null --write-out "GET /api/health: %{http_code}\n" http://localhost:3000/api/health >> recuperacion.txt
            adb logcat -d -v time > logcat.txt
            bash tool/entorno_pruebas.sh logs > entorno_logs.txt

      # Cuenta en logcat las veces que Android registró que la app se cerró o
      # se congeló y escribe el resumen: cuántos toques se dieron, los cierres
      # y congelamientos, y la reapertura con la respuesta de /api/health.
      # Falla si logcat registra algún cierre o congelamiento de la app,
      # aunque monkey no lo haya visto (por ejemplo, durante la reapertura).
      - name: Contar cierres y congelamientos en logcat y mostrar el resultado
        run: >
          dart run tool/resumen_pruebas.dart monkey monkey.txt logcat.txt
          --recuperacion recuperacion.txt

      # Guarda la bitácora de monkey, los mensajes del celular (logcat), la
      # reapertura y las bitácoras de los contenedores 30 días en Artifacts.
      # Corre siempre (if: always()): si la app se cerró, ahí está el reporte
      # del error, y el job sigue fallando por el paso que falló.
      - name: Guardar la bitácora de monkey y el logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-esfuerzo
          path: |
            arranque.txt
            monkey.txt
            logcat.txt
            recuperacion.txt
            entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30

  esfuerzo-api:
    name: Esfuerzo de la API (k6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Flutter hace falta para tool/resumen_pruebas.dart, que escribe el
      # resumen.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Descarga el backend al commit fijo y enciende la API y la base en
      # contenedores (.github/actions/entorno-aislado). Este trabajo tiene su
      # propio entorno: no lo comparte con ningún otro.
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # La misma versión de k6 en todas las corridas.
      - name: Instalar k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      # Las fases completas con la casilla «completo»; si no, a la mitad de su
      # duración. Cambia cuánto dura, no si la prueba corre.
      - name: Elegir la carga
        id: carga
        env:
          CARGA_COMPLETA: ${{ inputs.completo }}
        run: |
          if [ "$CARGA_COMPLETA" = "true" ]; then
            carga=completa
          else
            carga=reducida
          fi
          echo "carga=$carga" >> "$GITHUB_OUTPUT"
          echo "k6 correrá la carga $carga."

      # Corre k6 contra la API del contenedor. Si un umbral no se cumple (en el
      # esfuerzo o en la recuperación, o si aparece un 429), k6 termina con
      # error y el paso falla. Pase o falle, guarda las bitácoras.
      - name: Correr el esfuerzo con k6
        env:
          CARGA: ${{ steps.carga.outputs.carga }}
        run: |
          mkdir -p build/resultados
          if k6 run --summary-export build/resultados/k6_esfuerzo.json \
            --env API_BASE_URL=http://localhost:3000/api --env CARGA="$CARGA" \
            pruebas/k6/esfuerzo.js; then
            codigo_de_k6=0
          else
            codigo_de_k6=$?
          fi
          bash tool/entorno_pruebas.sh logs > build/resultados/entorno_logs.txt
          exit "$codigo_de_k6"

      # Escribe el resumen: peticiones, errores, tiempos y la recuperación.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart k6
          build/resultados/k6_esfuerzo.json
          --titulo "Esfuerzo de la API (k6)"

      # Guarda el resumen de k6 y las bitácoras 30 días en Artifacts. Corre
      # siempre (if: always()): si falló, ahí está por qué, y el job sigue
      # fallando por el paso que falló.
      - name: Guardar el resumen de k6 y las bitácoras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-k6-esfuerzo
          path: |
            build/resultados/k6_esfuerzo.json
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30
