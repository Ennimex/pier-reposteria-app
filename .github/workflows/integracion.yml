# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE INTEGRACIÓN
#
# Qué prueba: que varias historias funcionan juntas en un flujo completo
#   (por ejemplo iniciar sesión, ver el catálogo, llenar el carrito y llegar
#   al pago) con la app instalada y corriendo en un emulador Android real.
#   Hoy usa el cliente de API falso (FakeApiClient) y no toca el backend;
#   contra staging correrá cuando existan los ambientes (#12 y #13).
# Para qué sirve: encontrar fallos que las unitarias no ven: navegación,
#   estado compartido entre pantallas, permisos y comportamiento en Android.
# Cuándo corre: solo en Pull Requests que tocan código de la app (lib/,
#   integration_test/, android/, dependencias o este archivo) porque tarda
#   más que los demás (unos 8 minutos con el AVD en caché), y a mano.
# Si falla: el Pull Request muestra el check en rojo para que el revisor lo
#   vea; no es check obligatorio porque no corre en todos los PR.
# Dónde viven: integration_test/ (hoy app_smoke_test.dart).
# Issues: #21 (Sprint 1), #58 (Sprint 2), #65 (Sprint 4) y #69 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de integración

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test/fakes/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/integracion.yml'
  workflow_dispatch:

permissions:
  contents: read

# Si llega otro commit al mismo Pull Request, se cancela la corrida anterior.
concurrency:
  group: integracion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'
  # Emulador: Android 14 (API 34), perfil Pixel 6, sin ventana ni sonido.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  emulator:
    name: Smoke tests on Android API 34
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Gradle (compila el APK) y el emulador necesitan Java.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Sin esto el emulador corre sin aceleración de hardware en ubuntu-latest
      # y tarda cinco minutos en arrancar (ver run 37573804253).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La imagen del emulador (AVD) se guarda entre corridas: crearla desde
      # cero toma varios minutos; con caché la corrida bajó de 23 a 8 minutos.
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      # Solo cuando no había caché: arranca el emulador una vez y guarda la
      # instantánea para las siguientes corridas.
      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Arranca el emulador, compila e instala la app y corre los flujos de
      # integration_test/ dentro del dispositivo. --no-pub evita repetir la
      # descarga de dependencias.
      - name: Correr las pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test --no-pub
