name: Regresión

on:
  schedule:
    - cron: '0 8 * * 2'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Full suite and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-pixel_6-x86_64

      - name: Generate AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run integration smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test integration_test --no-pub

      - name: Check static analysis against baseline
        run: bash tool/check_analysis.sh

      - name: Run complete test suite with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  avisar:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: regression
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Regresión fallida: ${{ github.ref_name }} (run ${{ github.run_number }})" \
            --label bug \
            --body "La suite de regresión falló en \`${{ github.ref_name }}\` (${{ github.event_name }}, commit ${{ github.sha }}). Revisa el log: $RUN_URL"
