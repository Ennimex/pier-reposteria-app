# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE ESFUERZO
#
# Qué revisa: cómo se porta la app cuando se le exige más de lo normal.
#   · Uso aleatorio: monkey, una herramienta de Android, toca, desliza y
#     escribe al azar miles de veces sobre la app instalada en un celular
#     virtual (emulador): más rápido y con menos orden que cualquier persona.
#   · Volumen de datos: un catálogo de 1,000 productos y un carrito de 100
#     artículos, con el servidor de mentira (FakeApiClient).
# Para qué sirve: comprobar que la app no se cierra sola ni se congela (el
#   aviso «La app no responde» de Android, llamado ANR) antes de publicarla
#   en Google Play.
# Cuándo corre: es la cuarta etapa de pipeline.yml, junto con las pruebas de
#   rendimiento, después de la integración y la regresión: en cada Pull
#   Request y cada vez que algo se une a main, con 1,000 toques (versión
#   reducida); con la casilla «completo» del pipeline, 5,000. También a mano
#   (Actions → Pruebas de esfuerzo → Run workflow), eligiendo cuántos toques
#   dar (5,000 si no se cambia). Al cerrar #70 correrá sola con cada versión
#   nueva.
# Estado: el uso aleatorio ya funciona. El volumen solo corre si se marca la
#   casilla correr_volumen, y todavía faltan sus pruebas en test/esfuerzo/
#   (#70).
# Ojo: monkey usa la app normal, así que lo que toque sí llega al servidor
#   real. Como la app recién instalada no tiene sesión iniciada, casi todo es
#   navegar por el catálogo.
# Si falla: el pipeline falla y GitHub no deja unir el Pull Request.
# Dónde ver el resultado: Actions → la corrida → Summary: cuántos toques se
#   dieron, cuántas veces se cerró o se congeló la app y, si pasó, el reporte
#   del error y los mensajes de error del celular (logcat).
# Issue: #70 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de esfuerzo

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
    inputs:
      completo:
        description: Toda la carga (5,000 eventos) en vez de la reducida (1,000)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      eventos:
        description: Cantidad de eventos aleatorios de monkey
        default: '5000'
        required: false
      correr_volumen:
        description: Correr también las pruebas de volumen de test/esfuerzo/ (#70)
        type: boolean
        default: false
  # Se activará al cerrar #70 (correr con cada versión nueva):
  # push:
  #   tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # Nombre con el que Android identifica a la app (versión de producción,
  # la que se arma sin --flavor; ver android/app/build.gradle.kts).
  PAQUETE: mx.com.pierreposteria
  # El mismo celular virtual que integracion.yml, así reutilizan el que ya
  # está guardado.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  volumen:
    name: Volumen de datos
    # Solo corre si se marca la casilla correr_volumen al lanzarlo.
    if: inputs.correr_volumen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Las pruebas de test/esfuerzo/ llenan el catálogo y el carrito con el
      # servidor de mentira y revisan que las pantallas sigan respondiendo.
      - name: Catálogo de 1,000 productos y carrito de 100 artículos
        run: >
          flutter test test/esfuerzo --reporter expanded
          --file-reporter json:build/resultados/esfuerzo.json

      # Escribe el resumen: cada prueba de volumen con ✅.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/esfuerzo.json
          --titulo "Volumen de datos"
          --detalle

  monkey:
    name: Uso aleatorio (monkey)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Arma el APK de la versión de producción (sin --flavor), que queda en
      # build/app/outputs/flutter-apk/app-prod-debug.apk.
      - name: Compilar el APK de depuración
        run: flutter build apk --debug

      # Deja que el emulador use el procesador directamente (más detalle en
      # integracion.yml).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Recupera el celular virtual guardado o, si no hay, lo crea (igual que
      # en integracion.yml).
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Cuántos eventos lanza monkey: los que se pidan al lanzarlo a mano o,
      # desde pipeline.yml, 1,000 en cada Pull Request (versión reducida) y
      # 5,000 con la casilla «completo». Cambia la carga, no si la prueba
      # corre.
      - name: Elegir la cantidad de eventos
        id: carga
        env:
          EVENTOS_PEDIDOS: ${{ inputs.eventos }}
          CARGA_COMPLETA: ${{ inputs.completo }}
        run: |
          if [ -n "$EVENTOS_PEDIDOS" ]; then
            eventos="$EVENTOS_PEDIDOS"
          elif [ "$CARGA_COMPLETA" = "true" ]; then
            eventos=5000
          else
            eventos=1000
          fi
          echo "eventos=$eventos" >> "$GITHUB_OUTPUT"
          echo "monkey lanzará $eventos eventos."

      # Instala la app en el celular virtual y suelta a monkey:
      #   · -s 42 fija la «semilla»: cada corrida hace exactamente los mismos
      #     toques, así un error se puede repetir para estudiarlo.
      #   · --throttle 100 deja 100 ms entre toques, rápido pero posible.
      #   · --pct-syskeys 0 no usa los botones del sistema (Inicio, Atrás…),
      #     para que monkey no se salga de la app.
      # Lo que hace monkey se guarda en monkey.txt y los mensajes del celular
      # en logcat.txt. Si monkey reporta que la app se cerró (CRASH) o se
      # congeló (ANR / NOT RESPONDING), el paso falla.
      # Dos detalles: esos reportes salen por la salida de errores, por eso
      # 2>&1 los junta antes de guardarlos; y cada renglón de este script corre
      # por separado, por eso la revisión final va en un solo renglón.
      - name: Instalar la app y lanzar los eventos aleatorios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-prod-debug.apk
            adb logcat -c
            adb shell monkey -p ${{ env.PAQUETE }} -s 42 --throttle 100 --pct-syskeys 0 -v ${{ steps.carga.outputs.eventos }} 2>&1 | tee monkey.txt
            adb logcat -d -v time > logcat.txt
            if grep -qE "CRASH|ANR in|NOT RESPONDING" monkey.txt; then echo "::error::La app se cerró o dejó de responder bajo carga; revisa el resumen de la corrida."; exit 1; fi

      # Escribe el resumen: cuántos toques se dieron y que la app no se cerró
      # ni se congeló. Si pasó, el paso anterior ya detuvo el job y la tabla
      # de evidencias del pipeline lo dice, con la bitácora que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: dart run tool/resumen_pruebas.dart monkey monkey.txt logcat.txt

      # Guarda la bitácora de monkey y los mensajes del celular (logcat) 30
      # días en Artifacts. Corre siempre (if: always()): si la app se cerró,
      # ahí está el reporte del error, y el job sigue fallando por el paso que
      # falló.
      - name: Guardar la bitácora de monkey y el logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-esfuerzo
          path: |
            monkey.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 30
