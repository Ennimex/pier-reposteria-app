# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: ANÁLISIS DE CÓDIGO ESTÁTICO
#
# Qué revisa: el código escrito, SIN ejecutar la app. Busca errores y malas
#   prácticas; por ejemplo, una variable que nunca se usa, un error que se
#   atrapa sin decir de qué tipo es, o el mismo código copiado en dos lugares.
# Cómo lo hace: con dos revisores automáticos.
#   · flutter analyze, con las reglas de very_good_analysis (la lista está en
#     analysis_options.yaml). Cuenta errores, advertencias y avisos, y los
#     compara con la línea base: el máximo permitido hoy, guardado en
#     tool/check_analysis.sh (0 errores, 0 advertencias y 151 avisos).
#   · SonarCloud, un servicio externo que además exige que al menos el 80 %
#     del código nuevo tenga pruebas y que no más del 3 % esté repetido. A
#     esa condición le llama quality gate.
# Cuándo corre: es la primera etapa de pipeline.yml, junto con las pruebas
#   unitarias: en cada Pull Request hacia develop o main (la solicitud para
#   unir cambios) y cada vez que algo se une a develop o a main (así
#   SonarCloud tiene al día el código). También se puede lanzar sola, a mano.
# SonarCloud y develop: el plan de SonarCloud de la organización solo da el
#   quality gate de main y de los Pull Requests; para cualquier otra rama
#   responde «Organization is not allowed to access data from non main
#   branches» (corrida 40273588965). Por eso, en un push a develop, el job de
#   SonarCloud analiza y sube el resultado, pero no espera el quality gate:
#   ese cambio ya lo pasó en el Pull Request que lo llevó a develop, y el
#   resumen y la tabla de evidencias lo dicen. En los Pull Requests (hacia
#   develop y hacia main) y en el push a main, el quality gate es
#   obligatorio. Se decide con una expresión (ESPERA_EL_QUALITY_GATE), no con
#   un if: el job y todos sus pasos corren siempre.
# Si falla: el pipeline se detiene aquí y GitHub no deja unir el Pull
#   Request; los dos revisores son obligatorios en la regla «Proteger main»,
#   que protege main y develop.
# Dónde ver el resultado: Actions → la corrida → Summary: la tabla contra la
#   línea base, los avisos agrupados por regla y el veredicto de SonarCloud
#   con su enlace. La salida completa de flutter analyze queda en Artifacts
#   («resultados-analisis»).
# Issues: #18, #20 y #52 (Sprint 1).
# ─────────────────────────────────────────────────────────────────────────────
name: Análisis de código estático

on:
  # pipeline.yml lo llama en cada Pull Request y en cada push a develop o a
  # main, y le pasa la clave de SonarCloud.
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # La misma versión de Flutter con la que se midió la línea base: otra
  # versión puede contar los avisos de forma distinta.
  FLUTTER_VERSION: '3.44.4'

jobs:
  flutter-analyze:
    name: Línea base de flutter analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Los tres primeros pasos preparan la computadora que presta GitHub:
    # descargan el código, instalan Flutter y las librerías que usa la app.
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Corre flutter analyze y compara cuántos errores, advertencias y avisos
      # encontró contra la línea base. Si cualquiera de los tres sube, el paso
      # falla: ningún Pull Request puede agregar problemas nuevos. Quien
      # corrige avisos baja la línea base en ese mismo Pull Request.
      - name: Comparar flutter analyze con la línea base
        run: bash tool/check_analysis.sh

      # Escribe el resumen con lo que encontró flutter analyze (el paso
      # anterior lo deja en build/resultados/analisis.txt).
      - name: Mostrar el resultado en el resumen
        run: dart run tool/resumen_pruebas.dart analisis

      # Guarda la salida de flutter analyze 30 días en Artifacts. Corre
      # siempre (if: always()), también si el análisis rebasó la línea base:
      # es la evidencia, y el job sigue fallando por el paso que falló.
      - name: Guardar la salida de flutter analyze
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-analisis
          path: build/resultados/analisis.txt
          if-no-files-found: warn
          retention-days: 30

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Solo corre si flutter analyze pasó: no vale la pena el segundo revisor
    # si el primero ya encontró problemas.
    needs: flutter-analyze
    # Si este análisis espera el quality gate: «true» siempre, salvo en un
    # push a develop, donde SonarCloud no lo da (ver el encabezado). Lo usan
    # el escaneo (sonar.qualitygate.wait) y el resumen.
    env:
      ESPERA_EL_QUALITY_GATE: ${{ github.event_name != 'push' || github.ref_name != 'develop' }}
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v7
        with:
          # SonarCloud usa el historial completo para saber qué líneas son
          # nuevas en este Pull Request.
          fetch-depth: 0

      # Revisa que estén configurados el nombre del proyecto en SonarCloud
      # (variable SONAR_PROJECT_KEY) y su clave de acceso (secreto SONAR_TOKEN),
      # en Settings → Secrets and variables → Actions. Si falta alguno, lo
      # dice con un mensaje claro en vez de fallar más adelante.
      - name: Verificar la configuración de SonarCloud
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Configura la variable SONAR_PROJECT_KEY del repositorio."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configura el secreto SONAR_TOKEN del repositorio."
            exit 1
          fi

      # El programa que envía el código a SonarCloud funciona con Java.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # SonarCloud necesita saber qué parte del código ejecutan las pruebas
      # (la cobertura), así que este paso corre todas las pruebas y lo anota
      # en coverage/lcov.info. Menos las de la API (etiqueta api), que
      # necesitan el entorno aislado y corren en la etapa de integración.
      - name: Instalar dependencias y generar la cobertura
        run: |
          flutter pub get
          flutter test --coverage --exclude-tags api

      # Envía el código y la cobertura a SonarCloud. Cuando el job espera el
      # quality gate (ESPERA_EL_QUALITY_GATE: Pull Requests y push a main),
      # espera su veredicto y, si no se cumple (80 % de cobertura y máximo
      # 3 % repetido en el código nuevo), el paso falla. En un push a develop
      # solo sube el análisis.
      - name: Escanear con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=ennimex
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=${{ env.ESPERA_EL_QUALITY_GATE }}

      # Agrega al resumen el veredicto de SonarCloud y el enlace a su reporte
      # (el del Pull Request o el de la rama). Si el job esperó el quality
      # gate, llega aquí solo si se aprobó (si no, el paso anterior ya detuvo
      # el job). En un push a develop dice que el análisis se subió y que el
      # quality gate se verificó en el Pull Request.
      - name: Mostrar el resultado en el resumen
        env:
          PROYECTO: ${{ vars.SONAR_PROJECT_KEY }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RAMA: ${{ github.ref_name }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then
            reporte="https://sonarcloud.io/dashboard?id=$PROYECTO&pullRequest=$PULL_REQUEST"
          else
            reporte="https://sonarcloud.io/dashboard?id=$PROYECTO&branch=$RAMA"
          fi
          if [ "$ESPERA_EL_QUALITY_GATE" = true ]; then
            veredicto="✅ Quality gate aprobado"
          else
            veredicto="☁️ Análisis de $RAMA subido sin esperar el quality gate: se verificó en el Pull Request (el plan de SonarCloud no da el de ramas que no son main)"
          fi
          {
            echo "### ☁️ SonarCloud"
            echo
            echo "$veredicto · [Ver el reporte en SonarCloud]($reporte)"
          } >> "$GITHUB_STEP_SUMMARY"
