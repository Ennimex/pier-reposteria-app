# Análisis estático del proyecto (#18): very_good_analysis con una adopción
# gradual. Cada excepción dice por qué existe y cuándo se retira.
#
# Para silenciar un aviso puntual se puede usar `// ignore: nombre_de_regla`
# en la línea, siempre con un comentario que explique el motivo.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    # Los modos estrictos marcan cada uso de los Map crudos del backend sin
    # convertirlos de tipo (81 errores al adoptar el set). Se encienden cuando
    # cada pantalla tenga su ViewModel con datos tipados (MVVM, Fases 3 a 5).
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

linter:
  rules:
    # Pier es una app, no un paquete publicado: documentar cada miembro
    # público (642 avisos) no aporta a quien la mantiene.
    public_member_api_docs: false
    # El límite de 80 columnas choca con los árboles de widgets anidados y
    # con los textos de la interfaz (352 avisos) sin mejorar la lectura.
    lines_longer_than_80_chars: false
