# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE RENDIMIENTO
#
# Qué revisa: dos cosas que el usuario nota aunque no sepa nombrarlas.
#   · Cuánto pesa la app al descargarla (el APK). Ejemplo: si alguien agrega
#     imágenes sin comprimir, el peso sube y aquí se ve cuánto y dónde.
#   · Qué tan rápido abre y qué tan fluida se siente al recorrer el catálogo
#     y pasar al pago, medido en un celular de verdad.
# Para qué sirve: comparar cada versión con la medición de referencia del
#   Sprint 3 y descubrir si la app se volvió más lenta o más pesada ANTES de
#   publicarla.
# Cuándo corre: es la cuarta etapa de pipeline.yml, junto con las pruebas de
#   esfuerzo, después de la integración y la regresión: en cada Pull Request
#   y cada vez que algo se une a main. También sola con cada versión nueva
#   (tag vX.Y.Z) y a mano (Actions → Pruebas de rendimiento → Run workflow).
# Dónde corre: el peso se mide en la computadora que presta GitHub. La
#   fluidez no: Flutter solo la mide bien en un celular real (modo profile),
#   así que se mide en el Samsung SM-N975U del equipo.
# Estado: el peso corre aquí. La fluidez se mide desde la laptop con el
#   celular conectado (#61), con el mismo comando del trabajo «tiempos»; los
#   resultados se anotan en el issue de la medición. El trabajo «tiempos»
#   solo correría con una computadora propia registrada en GitHub (runner
#   self-hosted) y la casilla medir_en_celular; no hay ninguna registrada
#   porque el repositorio es público y un Pull Request ajeno podría ejecutar
#   código en ella.
# Si falla: el pipeline falla y GitHub no deja unir el Pull Request; en una
#   versión, no se publica hasta revisar el resultado.
# Dónde ver el resultado: Actions → la corrida → Summary: el peso total, qué
#   ocupa más espacio dentro del APK y, cuando se mida en el celular, cuánto
#   tarda en dibujarse la pantalla. El APK se descarga desde Artifacts.
# Issues: #61 (Sprint 3, medición de referencia) y #71 (Sprint 5, versión
#   candidata).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de rendimiento

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
  workflow_dispatch:
    inputs:
      medir_en_celular:
        description: 'Medir arranque y fluidez en el celular (requiere un runner propio, #61)'
        type: boolean
        default: false
  # Cada versión nueva: el peso se compara con la línea base de #61.
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # Número de serie del Samsung SM-N975U del equipo (lo da `adb devices`).
  DISPOSITIVO: RF8M835TANV

jobs:
  peso-del-apk:
    name: Peso del APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Java hace falta para armar el APK.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Arma el APK final (release), igual al que se publicaría, y desglosa qué
      # ocupa espacio dentro: el motor de Flutter, el código de la app, las
      # imágenes… Solo para procesadores arm64, los de los celulares actuales
      # como el del equipo. En GitHub no está la llave de firma del equipo,
      # así que se firma con la de pruebas; el peso es el mismo.
      - name: Compilar el APK de release y analizar su peso
        run: flutter build apk --release --analyze-size --target-platform android-arm64

      # Escribe el resumen: el peso total, lo que más ocupa dentro del APK y
      # las librerías que más pesan. Llega aquí solo si el APK se armó.
      - name: Mostrar el resultado en el resumen
        run: dart run tool/resumen_pruebas.dart peso

      # Guarda el APK medido 30 días en Artifacts, por si hay que instalarlo;
      # el resultado de la medición ya está en el resumen.
      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

  tiempos:
    name: Arranque y fluidez en el celular
    # Solo corre si se marca la casilla medir_en_celular al lanzarlo.
    if: inputs.medir_en_celular
    runs-on: [self-hosted, android-device]
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # La computadora del equipo ya tiene Flutter y las herramientas de
      # Android instaladas.
      - name: Instalar dependencias
        run: flutter pub get

      # Abre la app en el Samsung en modo profile (casi tan rápida como la
      # versión final, pero se deja medir) y graba cuánto tarda en dibujarse
      # cada cuadro de la pantalla al abrir la app, recorrer el catálogo y
      # pasar al pago. Para verse fluida, cada cuadro debe dibujarse en menos
      # de 16 ms (60 cuadros por segundo).
      # Se instala como «Pier DEV» (--flavor dev) para no tocar la app «Pier»
      # del celular, apuntando al servidor real, y entra con la cuenta de
      # prueba (los mismos secretos que el trabajo «flujos» de integracion.yml).
      - name: Medir con traceAction en modo profile
        env:
          USUARIO_PRUEBA: ${{ secrets.USUARIO_PRUEBA }}
          CLAVE_PRUEBA: ${{ secrets.CLAVE_PRUEBA }}
        run: >
          flutter drive
          --driver=test_driver/perf_driver.dart
          --target=integration_test/rendimiento/rendimiento_test.dart
          --profile --no-dds --flavor dev
          -d ${{ env.DISPOSITIVO }}
          --dart-define=API_BASE_URL=https://pier-reposteria-backend.onrender.com/api
          --dart-define=USUARIO_PRUEBA="$(printf '%s' "$USUARIO_PRUEBA" | tr -d '\r\n')"
          --dart-define=CLAVE_PRUEBA="$(printf '%s' "$CLAVE_PRUEBA" | tr -d '\r\n')"

      # Escribe el resumen: una columna por medición con el tiempo promedio por
      # cuadro, el del 90 % de los cuadros, el peor, y cuántos tardaron más de
      # 16 ms.
      - name: Mostrar el resultado en el resumen
        run: dart run tool/resumen_pruebas.dart tiempos
