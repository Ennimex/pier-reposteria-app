# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: ANÁLISIS DE CÓDIGO ESTÁTICO
#
# Qué prueba: revisa todo el código de cada Pull Request SIN ejecutar la app.
#   Busca errores, malas prácticas, código duplicado, vulnerabilidades y
#   cobertura insuficiente en el código nuevo.
# Para qué sirve: que main nunca reciba código con errores conocidos y que la
#   deuda técnica se mida sprint a sprint en SonarCloud.
# Cuándo corre: al abrir o actualizar un Pull Request hacia main, en cada push
#   a main (para que SonarCloud actualice la rama principal) y a mano.
# Si falla: el Pull Request queda bloqueado. Los dos jobs son checks
#   obligatorios del ruleset «Proteger main».
# Resultados: en el resumen de la corrida (pestaña Summary): la tabla contra
#   la línea base, los errores y advertencias con archivo y línea, los avisos
#   por regla y el veredicto de SonarCloud con su enlace (#157).
# Herramientas: flutter analyze con las reglas de very_good_analysis
#   (analysis_options.yaml) y SonarCloud con su quality gate (cobertura nueva
#   ≥ 80 %, duplicación ≤ 3 %, sin errores ni vulnerabilidades nuevas).
# Issues: #18, #20 y #52 (Sprint 1).
# ─────────────────────────────────────────────────────────────────────────────
name: Análisis de código estático

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Si llega otro commit al mismo Pull Request, se cancela la corrida anterior.
concurrency:
  group: analisis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Misma versión con la que se midió la línea base de tool/check_analysis.sh.
  FLUTTER_VERSION: '3.44.4'

jobs:
  flutter-analyze:
    name: Línea base de flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # tool/check_analysis.sh corre `flutter analyze` y compara el conteo de
      # errores, avisos e informativos con la línea base (0 / 0 / 151). Si
      # cualquiera de los tres sube, el paso falla: ningún Pull Request agrega
      # deuda nueva. Al corregir avisos, la línea base se baja en el mismo PR.
      - name: Comparar flutter analyze con la línea base
        run: bash tool/check_analysis.sh

      # check_analysis.sh deja la salida en build/resultados/analisis.txt y
      # este paso la convierte en el resumen de la corrida. Corre aunque el
      # paso anterior falle, que es cuando más se necesita.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        run: dart run tool/resumen_pruebas.dart analisis

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No vale la pena escanear si el análisis básico ya falló.
    needs: flutter-analyze
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v7
        with:
          # SonarCloud necesita el historial completo para distinguir qué
          # líneas son nuevas en este Pull Request.
          fetch-depth: 0

      # SONAR_PROJECT_KEY es una variable del repositorio y SONAR_TOKEN un
      # secreto (Settings → Secrets and variables → Actions).
      - name: Verificar la configuración de SonarCloud
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Configura la variable SONAR_PROJECT_KEY del repositorio."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configura el secreto SONAR_TOKEN del repositorio."
            exit 1
          fi

      # El scanner de SonarCloud corre sobre Java.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # El quality gate exige cobertura en el código nuevo y la toma de
      # coverage/lcov.info (ver sonar-project.properties), así que este job
      # corre la suite completa por su cuenta: no depende de otro workflow.
      - name: Instalar dependencias y generar la cobertura
        run: |
          flutter pub get
          flutter test --coverage

      # sonar.qualitygate.wait=true hace que el paso espere el veredicto de
      # SonarCloud y falle si el quality gate no se cumple.
      - name: Escanear con SonarCloud y esperar el quality gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=ennimex
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      # El veredicto y el enlace al reporte de SonarCloud (del Pull Request o
      # de la rama) quedan en el resumen, debajo de la tabla de flutter analyze.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        env:
          RESULTADO: ${{ steps.sonar.outcome }}
          PROYECTO: ${{ vars.SONAR_PROJECT_KEY }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RAMA: ${{ github.ref_name }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then
            reporte="https://sonarcloud.io/dashboard?id=$PROYECTO&pullRequest=$PULL_REQUEST"
          else
            reporte="https://sonarcloud.io/dashboard?id=$PROYECTO&branch=$RAMA"
          fi
          case "$RESULTADO" in
            success) veredicto="✅ Quality gate aprobado" ;;
            failure) veredicto="❌ Quality gate no aprobado o el escaneo falló: revisa el log del paso" ;;
            *) veredicto="⏭️ No se escaneó: falló un paso anterior" ;;
          esac
          {
            echo "### ☁️ SonarCloud"
            echo
            echo "$veredicto · [Ver el reporte en SonarCloud]($reporte)"
          } >> "$GITHUB_STEP_SUMMARY"
