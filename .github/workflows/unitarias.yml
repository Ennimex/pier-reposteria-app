# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS UNITARIAS
#
# Qué revisa: cada pieza de la app por separado, sin abrir la app completa.
#   Ejemplos reales: que agregar dos veces el mismo producto sume la cantidad
#   en lugar de repetir la línea del carrito, o que si el servidor rechaza
#   una cantidad (porque no hay existencias) el carrito regrese a la anterior.
# Cómo lo hace: las pruebas no usan el servidor real. Usan un servidor de
#   mentira (FakeApiClient) que contesta lo que cada prueba le prepara: no
#   hace falta internet y no se toca la base de datos.
# Cuándo corre: cada vez que se abre o se actualiza un Pull Request (la
#   solicitud para unir cambios a main, la versión oficial del código),
#   cuando algo se une a main y cuando alguien lo lanza a mano.
# Si falla: GitHub no deja unir el Pull Request hasta que se corrija.
# Dónde ver el resultado: Actions → la corrida → Summary. Dice cuántas
#   pruebas pasaron, muestra el error de las que fallaron y qué porcentaje
#   del código ejecutaron las pruebas (cobertura), carpeta por carpeta.
# Dónde están las pruebas: test/unitarias/ (una carpeta por tema: auth,
#   catalogo, pedidos…), test/widget/ (cada pantalla por separado) y tres
#   archivos sueltos en test/ que revisan el arranque y la versión de la app.
# Issues: #15, #16 y #17 (Sprint 1), #54 y #55 (Sprint 2), #63 (Sprint 4)
#   y #67 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas unitarias

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Si llega un cambio nuevo al mismo Pull Request, se cancela la corrida
# anterior: ya no tiene caso revisar una versión que cambió.
concurrency:
  group: unitarias-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  unitarias:
    name: Unitarias y de widget, con cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los tres primeros pasos preparan la computadora que presta GitHub:
    # descargan el código, instalan Flutter (la misma versión en todos los
    # pipelines) y las librerías que usa la app.
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Corre las pruebas. Las carpetas se nombran una por una para no repetir
      # aquí las de aceptación, que tienen su propio pipeline.
      # --coverage anota qué líneas del código se ejecutaron (la cobertura) y
      # --file-reporter guarda el resultado de cada prueba en un archivo, con
      # el que se arma el resumen.
      - name: Correr las pruebas unitarias y de widget
        run: >
          flutter test --coverage
          --file-reporter json:build/resultados/unitarias.json
          test/unitarias
          test/widget
          test/app_test.dart
          test/app_version_test.dart
          test/app_widget_test.dart

      # Escribe el resumen de la corrida con esos dos archivos. Corre aunque
      # fallen pruebas, que es justo cuando más se necesita.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/unitarias.json
          --titulo "Pruebas unitarias y de widget"
          --cobertura coverage/lcov.info
