# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE INTEGRACIÓN
#
# Qué revisa: que las partes de la app funcionan juntas, con la app completa
#   instalada en un celular Android virtual (emulador) que corre dentro de la
#   computadora de GitHub. Las pruebas de hoy abren la app, intentan entrar
#   con una contraseña incorrecta y cargan el catálogo.
# Para qué sirve: encuentra fallos que las pruebas por pieza no ven; por
#   ejemplo, una pantalla que no lleva a la siguiente o algo que solo falla
#   en un celular Android.
# Cómo lo hace: también usa el servidor de mentira (FakeApiClient), así que
#   no toca el servidor real. Cuando existan los ambientes de prueba (#12 y
#   #13) correrá contra un servidor de pruebas.
# Cuándo corre: solo en los Pull Requests que cambian la app (lib/,
#   integration_test/, android/, las librerías o este archivo), porque tarda
#   unos 8 minutos; también se puede lanzar a mano.
# Si falla: el Pull Request muestra la prueba en rojo para que quien lo
#   revise lo vea. No bloquea la unión porque no corre en todos los PR.
# Dónde ver el resultado: Actions → la corrida → Summary: cada prueba con ✅
#   o ❌ y el error de las que fallen.
# Dónde están las pruebas: integration_test/ (hoy app_smoke_test.dart).
# Issues: #21 (Sprint 1), #58 (Sprint 2), #65 (Sprint 4) y #69 (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de integración

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test/fakes/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/integracion.yml'
  workflow_dispatch:

permissions:
  contents: read

# Si llega un cambio nuevo al mismo Pull Request, se cancela la corrida
# anterior: ya no tiene caso revisar una versión que cambió.
concurrency:
  group: integracion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'
  # El celular virtual: Android 14 (API 34) con las medidas de un Pixel 6,
  # sin ventana ni sonido porque nadie lo está mirando.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  emulator:
    name: Smoke tests on Android API 34
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Java hace falta para armar el APK (el archivo que se instala en el
      # celular) y para el emulador.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Deja que el emulador use el procesador directamente. Sin esto corre en
      # modo lento y tarda cinco minutos solo en encender (corrida 37573804253).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El celular virtual ya creado (AVD) se guarda entre corridas, porque
      # crearlo desde cero toma varios minutos. Con esto la corrida bajó de 23
      # a 8 minutos.
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      # Solo si no había uno guardado: crea el celular virtual, lo enciende una
      # vez y lo guarda para las siguientes corridas.
      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Enciende el celular virtual, instala la app y corre dentro de él las
      # pruebas de integration_test/. --no-pub evita volver a descargar las
      # librerías y --file-reporter guarda el resultado de cada prueba en un
      # archivo, con el que se arma el resumen.
      - name: Correr las pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test --no-pub --file-reporter json:build/resultados/integracion.json

      # Escribe el resumen: cada prueba con ✅ o ❌. Corre aunque fallen
      # pruebas; si el celular virtual no encendió, el resumen lo avisa.
      - name: Mostrar el resultado en el resumen
        if: ${{ !cancelled() }}
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/integracion.json
          --titulo "Pruebas de integración en el emulador (Android 14)"
          --detalle
