# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE: PRUEBAS DE INTEGRACIÓN
#
# Qué revisa: que las partes funcionan juntas. Tiene tres trabajos que corren
#   al mismo tiempo; el tercero corre dos veces, una por celular virtual:
#   · Pruebas rápidas (smoke): la app completa instalada en un celular
#     Android virtual (emulador) abre, intenta entrar con una contraseña
#     incorrecta y carga el catálogo, con el servidor de mentira
#     (FakeApiClient).
#   · API contra entorno aislado: la API real del backend y su base de datos
#     en contenedores (tool/entorno_pruebas.sh), con datos ficticios. Revisa
#     que la API contesta lo que la app espera: el estado del servidor, el
#     catálogo (cada producto pasa por Product.fromJson, el mismo código de
#     la app), las categorías y el inicio de sesión, bueno y malo.
#   · Flujos de compra, reseña y entrega en el entorno aislado: la app
#     instalada en el emulador habla con esa misma API en contenedores
#     (desde el emulador, http://10.0.2.2:3000/api) e inicia sesión con las
#     cuentas ficticias de la semilla. Corre en dos celulares virtuales
#     distintos (#81, fragmentación): Android 10 (API 29) con una pantalla
#     chica de 5 pulgadas y Android 14 (API 34) con una grande de 6.7. Cada
#     uno corre en su propia computadora, con su propio entorno aislado. Tres
#     flujos, uno tras otro:
#       - Compra: abre un producto con existencias, lo añade al carrito y
#         llega a «Finalizar Pedido». El pago queda fuera: la llave de
#         Stripe del entorno aislado es ficticia.
#       - Del catálogo a la reseña: busca en el catálogo el producto del
#         pedido completado que trae la semilla y lo abre, ve el pedido en
#         «Pedidos» → «Historial» y su detalle, y califica el producto con
#         5 estrellas y un comentario: la reseña sale publicada como
#         «Compra verificada».
#       - Entrega y reembolso: el repartidor de la semilla se pone
#         disponible, toma el pedido a domicilio pagado que trae la semilla,
#         sale en camino, avisa que llegó y confirma la entrega con el nombre
#         de quien la recibió; la entrega queda en su «Historial». Después el
#         cliente pide el reembolso de ese pedido y la solicitud aparece en
#         «Mis Reembolsos» como pendiente.
# Para qué sirve: encuentra fallos que las pruebas por pieza no ven; por
#   ejemplo, una pantalla que no lleva a la siguiente, algo que solo falla
#   en un celular Android, en un Android viejo o en una pantalla chica, o un
#   cambio del backend que la app ya no entiende.
# Cuándo corre: es la tercera etapa de pipeline.yml, junto con la regresión,
#   después de las pruebas de aceptación: en cada Pull Request (la solicitud
#   para unir cambios a main, la versión oficial del código) y cada vez que
#   algo se une a main. También se puede lanzar sola, a mano.
# Ojo: el flujo de compra contra el servidor real (#58), con el pago, no vive
#   aquí: está en flujo-compra.yml, fuera del pipeline de los Pull Requests
#   (necesita la cuenta de prueba y el servidor de producción), y en la
#   regresión completa de los martes (regresion-completa.yml). Aquí corre la
#   misma prueba, sin el pago, contra el entorno aislado.
# Si falla: el pipeline se detiene aquí y GitHub no deja unir el Pull
#   Request hasta que se corrija. Basta con que los flujos fallen en uno de
#   los dos celulares virtuales.
# Dónde ver el resultado: Actions → la corrida → Summary: cada prueba con ✅;
#   si alguna falla, la tabla de evidencias del pipeline dice cuál y en qué
#   Android. Los reportes quedan en Artifacts: «resultados-integracion»,
#   «resultados-api» y, uno por celular virtual,
#   «resultados-flujo-entorno-aislado-android-10» y
#   «resultados-flujo-entorno-aislado-android-14». Los tres últimos traen las
#   bitácoras de los contenedores; los dos de los flujos, los tres flujos.
# Dónde están las pruebas: integration_test/app_smoke_test.dart, test/api/,
#   integration_test/flujos/compra_test.dart,
#   integration_test/flujos/catalogo_resena_test.dart e
#   integration_test/flujos/entrega_reembolso_test.dart.
# Issues: #21 (Sprint 1), #58 (Sprint 2), #65 (Sprint 4), #69 y #81
#   (Sprint 5).
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas de integración

on:
  # pipeline.yml la llama en cada Pull Request y en cada push a main.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  # El celular virtual de las pruebas rápidas: Android 14 (API 34) con las
  # medidas de un Pixel 6, sin ventana ni sonido porque nadie lo está mirando.
  # Los flujos contra el entorno aislado usan otros dos, los de la matriz de
  # su trabajo, con estas mismas opciones.
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  emulator:
    name: Pruebas rápidas (smoke) en Android 14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Quita de la imagen lo que no se usa (.NET, Haskell, CodeQL y Boost)
      # para que compilar el APK no se quede sin disco; no toca el SDK de
      # Android (.github/actions/liberar-disco).
      - name: Liberar disco
        uses: ./.github/actions/liberar-disco

      # Java hace falta para armar el APK (el archivo que se instala en el
      # celular) y para el emulador.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Guarda lo que Gradle descarga para compilar (los plugins de Kotlin
          # y de Android, las bibliotecas): sin esto cada trabajo lo pedía
          # otra vez a Maven Central, que a ratos responde 429 y tumbaba el
          # pipeline sin que el código tuviera que ver. La copia cambia
          # cuando cambian estos archivos.
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Deja que el emulador use el procesador directamente. Sin esto corre en
      # modo lento y tarda cinco minutos solo en encender (corrida 37573804253).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El celular virtual ya creado (AVD) se guarda entre corridas, porque
      # crearlo desde cero toma varios minutos. Con esto la corrida bajó de 23
      # a 8 minutos.
      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      # Solo si no había uno guardado: crea el celular virtual, lo enciende una
      # vez y lo guarda para las siguientes corridas.
      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Enciende el celular virtual, instala la app y corre dentro de él las
      # pruebas rápidas. --no-pub evita volver a descargar las librerías y
      # --file-reporter guarda el resultado de cada prueba en un archivo, con
      # el que se arma el resumen.
      - name: Correr las pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test/app_smoke_test.dart --no-pub --file-reporter json:build/resultados/integracion.json

      # Escribe el resumen: cada prueba con ✅. Si alguna falló, el paso
      # anterior ya detuvo el job y la tabla de evidencias del pipeline dice
      # cuál, con el reporte que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/integracion.json
          --titulo "Pruebas de integración en el emulador (Android 14)"
          --detalle

      # Guarda el reporte 30 días en Artifacts. Corre siempre (if: always()),
      # también si falló una prueba: es la evidencia, y el job sigue fallando
      # por el paso que falló.
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-integracion
          path: build/resultados/integracion.json
          if-no-files-found: warn
          retention-days: 30

  api:
    name: API contra entorno aislado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Los tres primeros pasos preparan la computadora que presta GitHub:
    # descargan el código, instalan Flutter y las librerías que usa la app.
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Descarga el backend al commit fijo y enciende la API y la base en
      # contenedores (.github/actions/entorno-aislado).
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # Corre las pruebas de test/api/ contra la API del contenedor. Un
      # flutter test normal las omite (dart_test.yaml: necesitan el entorno),
      # por eso --run-skipped; --file-reporter guarda el resultado de cada una.
      # Pase o falle, guarda después las bitácoras de los contenedores, y el
      # paso termina con el código de las pruebas: si una falla, el job falla.
      - name: Correr las pruebas de la API
        run: |
          if flutter test test/api --tags api --run-skipped --reporter expanded \
            --file-reporter json:build/resultados/api.json \
            --dart-define=API_BASE_URL=http://localhost:3000/api; then
            codigo_de_las_pruebas=0
          else
            codigo_de_las_pruebas=$?
          fi
          bash tool/entorno_pruebas.sh logs > build/resultados/entorno_logs.txt
          exit "$codigo_de_las_pruebas"

      # Escribe el resumen: cada prueba con ✅. Si alguna falló, el paso
      # anterior ya detuvo el job y la tabla de evidencias del pipeline dice
      # cuál, con el reporte que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/api.json
          --titulo "API contra entorno aislado"
          --detalle

      # Guarda el reporte y las bitácoras de los contenedores 30 días en
      # Artifacts. Corre siempre (if: always()), también si el entorno no
      # arrancó o falló una prueba: es la evidencia, y el job sigue fallando
      # por el paso que falló.
      - name: Guardar el reporte y las bitácoras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-api
          path: |
            build/resultados/api.json
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30

  flujo-compra-aislado:
    name: Flujos de compra, reseña y entrega en el entorno aislado (Android ${{ matrix.android }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Fragmentación (#81): los mismos tres flujos en dos celulares virtuales,
    # al mismo tiempo. Cada uno corre en su propia computadora de GitHub y
    # levanta su propio entorno aislado (su API y su base recién sembrada): la
    # reseña y la entrega que deja uno no las ve el otro.
    #   · Android 10 (API 29) con las medidas de un Nexus 5: 5 pulgadas y
    #     360 × 640 puntos, el ancho de los Galaxy S y de muchos teléfonos de
    #     entrada. Es donde menos cabe: ahí se vieron las tarjetas del
    #     catálogo desbordadas (#362) y el botón «Añadir» sin texto (#364).
    #   · Android 14 (API 34) con las medidas de un Pixel 6 Pro: 6.7 pulgadas
    #     y 411 × 891 puntos.
    # «perfil» es el id del dispositivo en avdmanager (avdmanager list
    # device); «avd» va en la llave de la caché y «pantalla», en el título
    # del resumen.
    # Las pruebas corren en modo debug: si en una pantalla del recorrido algo
    # no cabe (RenderFlex overflowed), Flutter lo reporta como error y la
    # prueba falla.
    # fail-fast: false: si los flujos fallan en un celular, el otro termina
    # igual, porque hace falta saber en cuál pasan y en cuál no. La etapa
    # falla si fallan en cualquiera de los dos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: 10
            api: 29
            perfil: Nexus 5
            avd: api29-nexus5
            pantalla: 5 pulgadas
          - android: 14
            api: 34
            perfil: pixel_6_pro
            avd: api34-pixel6pro
            pantalla: 6.7 pulgadas
    # Los primeros pasos preparan la computadora (más detalle en el trabajo
    # de las pruebas rápidas).
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Quita de la imagen lo que no se usa (.NET, Haskell, CodeQL y Boost)
      # para que compilar el APK no se quede sin disco; no toca el SDK de
      # Android (.github/actions/liberar-disco).
      - name: Liberar disco
        uses: ./.github/actions/liberar-disco

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Guarda lo que Gradle descarga para compilar (los plugins de Kotlin
          # y de Android, las bibliotecas): sin esto cada trabajo lo pedía
          # otra vez a Maven Central, que a ratos responde 429 y tumbaba el
          # pipeline sin que el código tuviera que ver. La copia cambia
          # cuando cambian estos archivos.
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Primero el servidor: descarga el backend al commit fijo y enciende la
      # API y la base en contenedores (.github/actions/entorno-aislado). Queda
      # en el puerto 3000 de esta computadora, que el emulador ve como
      # 10.0.2.2.
      - name: Levantar el entorno aislado
        uses: ./.github/actions/entorno-aislado

      # Después, el celular virtual de esta vuelta de la matriz (los pasos son
      # los de las pruebas rápidas). Cada celular guarda su AVD en la caché
      # con su propia llave.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restaurar el AVD de la caché
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.avd }}-x86_64

      - name: Generar el AVD para la caché
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.perfil }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD generado para la caché."

      # Corre en el emulador, uno tras otro, los tres flujos contra la API
      # del contenedor:
      #   · compra_test.dart, solo el escenario «del inicio de sesión al
      #     checkout». El otro escenario del archivo, el del pago, queda fuera
      #     a propósito: la llave de Stripe del entorno aislado es ficticia y
      #     el servidor no puede crear el intento de pago. Esa prueba corre
      #     contra producción en flujo-compra.yml.
      #   · catalogo_resena_test.dart (#65): del catálogo a la reseña, con el
      #     pedido completado de la semilla. Deja una reseña en la base del
      #     contenedor, que se desecha con la computadora del job.
      #   · entrega_reembolso_test.dart (#69): el repartidor entrega el pedido
      #     a domicilio de la semilla y el cliente pide su reembolso. Deja la
      #     entrega y la solicitud en la base del contenedor.
      #   · --name elige esos tres escenarios por su nombre (es una expresión
      #     regular: «|» separa uno de otro).
      #   · --dart-define=API_BASE_URL apunta la app a 10.0.2.2:3000, el
      #     entorno aislado (el APK de pruebas permite http sin cifrar:
      #     android/app/src/debug/AndroidManifest.xml).
      #   · USUARIO_PRUEBA y CLAVE_PRUEBA son los del cliente de la semilla
      #     (docker/semilla/semilla_pruebas.sql), y REPARTIDOR_PRUEBA y
      #     CLAVE_REPARTIDOR_PRUEBA, los de su repartidor: ficticios, solo
      #     existen en el contenedor y no son secretos.
      # Los tres dejan su resultado en el mismo reporte, que lleva en el
      # nombre el Android de este celular virtual
      # (flujo_entorno_aislado_android_10.json o _14.json): con ese nombre lo
      # busca la tabla de evidencias del pipeline. Pase o falle, guarda
      # después las bitácoras de los contenedores, y el renglón termina con el
      # código de las pruebas: si una falla, el job falla. Va en un solo
      # renglón (>) porque el emulador corre cada renglón por separado.
      - name: Correr los flujos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.perfil }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: >
            mkdir -p build/resultados;
            if flutter test integration_test/flujos/compra_test.dart
            integration_test/flujos/catalogo_resena_test.dart
            integration_test/flujos/entrega_reembolso_test.dart --no-pub
            --name "Escenario: del inicio de sesión al checkout|Escenario: calificar un producto de un pedido completado|Escenario: entregar un pedido a domicilio y pedir su reembolso"
            --dart-define=API_BASE_URL=http://10.0.2.2:3000/api
            --dart-define=USUARIO_PRUEBA=cliente@pier.test
            --dart-define=CLAVE_PRUEBA=Chocoflan-Prueba-2026
            --dart-define=REPARTIDOR_PRUEBA=repartidor@pier.test
            --dart-define=CLAVE_REPARTIDOR_PRUEBA=Repartidor-Prueba-2026
            --file-reporter json:build/resultados/flujo_entorno_aislado_android_${{ matrix.android }}.json;
            then codigo_de_la_prueba=0; else codigo_de_la_prueba=$?; fi;
            bash tool/entorno_pruebas.sh logs > build/resultados/entorno_logs.txt;
            exit "$codigo_de_la_prueba"

      # Escribe el resumen: cada escenario con ✅, agrupado por historia (#58,
      # #65 y #69), con el Android y la pantalla de este celular virtual en el
      # título. Si alguno falló, el paso anterior ya detuvo el job y la tabla
      # de evidencias del pipeline lo dice, con el reporte que se sube abajo.
      - name: Mostrar el resultado en el resumen
        run: >
          dart run tool/resumen_pruebas.dart pruebas
          build/resultados/flujo_entorno_aislado_android_${{ matrix.android }}.json
          --titulo "Flujos de compra, reseña y entrega en el entorno aislado (Android ${{ matrix.android }}, ${{ matrix.pantalla }})"
          --detalle

      # Guarda el reporte y las bitácoras de los contenedores 30 días en
      # Artifacts, en un artefacto por celular virtual (dos trabajos no
      # pueden subir uno con el mismo nombre). Corre siempre (if: always()),
      # también si el entorno no arrancó o la prueba falló: es la evidencia, y
      # el job sigue fallando por el paso que falló.
      - name: Guardar el reporte y las bitácoras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-flujo-entorno-aislado-android-${{ matrix.android }}
          path: |
            build/resultados/flujo_entorno_aislado_android_${{ matrix.android }}.json
            build/resultados/entorno_logs.txt
          if-no-files-found: warn
          retention-days: 30
