name: Integración Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test/fakes/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/integracion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 34
  AVD_PROFILE: pixel_6
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

jobs:
  emulator:
    name: Smoke tests on Android API 34
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Sin esto el emulador corre sin aceleración de hardware en ubuntu-latest
      # y tarda cinco minutos en arrancar (ver run 37573804253).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_PROFILE }}-x86_64

      - name: Generate AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run integration tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          profile: ${{ env.AVD_PROFILE }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: flutter test integration_test --no-pub
